<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tower Crash</title>
  <link rel="stylesheet" href="styles.css">
  <script src="casino-utils.js"></script>
  <style>
    body{
      background:
        radial-gradient(circle at 50% 10%, #87b8c5 0%, #21414d 28%, #152731 52%, #0a1218 100%);
    }
    .tower-shell{
      max-width:920px;margin:auto;position:relative;overflow:hidden;
      background:linear-gradient(145deg,#233741,#0f1a20);
      border:2px solid #c9a45e;
      box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 34px rgba(201,164,94,.15)
    }
    .tower-shell:before{
      content:"ROYAL ASCENT";
      position:absolute;top:10px;left:50%;transform:translateX(-50%);
      font-size:12px;letter-spacing:4px;color:#f1ddaf;opacity:.72;font-weight:900
    }
    .tower-title{
      font-size:38px;
      margin-top:12px;
      background:linear-gradient(#f7e4b3,#d3aa61,#8e6523);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:none
    }
    .tower-board{
      position:relative;
      display:flex;flex-direction:column-reverse;gap:12px;
      max-width:760px;margin:18px auto;
      padding:18px;border-radius:22px;
      background:linear-gradient(180deg,#101c21,#162a31 58%,#0d1519 100%);
      border:2px solid rgba(201,164,94,.26);
      box-shadow:inset 0 0 28px rgba(0,0,0,.5),0 0 18px rgba(201,164,94,.08)
    }
    .tower-board:before{
      content:"";
      position:absolute;inset:12px;
      border-radius:18px;
      border:1px solid rgba(241,221,175,.06);
      pointer-events:none
    }
    .tower-row{
      display:flex;gap:12px;align-items:center;justify-content:center;
      transition:.18s ease;
      min-height:60px
    }
    .tower-row.active{transform:scale(1.01)}
    .tower-row.locked,.tower-row.passed{opacity:.42}
    .tower-row.passed{opacity:.78}
    .tower-tile{
      min-width:78px;height:58px;border-radius:16px;font-size:24px;padding:0;
      background:linear-gradient(180deg,#30454f,#1a2c35);
      border:1px solid rgba(244,230,196,.08);
      box-shadow:inset 0 1px 8px rgba(255,255,255,.04), inset 0 -10px 14px rgba(0,0,0,.24);
      position:relative;z-index:2;transition:.18s ease
    }
    .tower-tile:hover:not(:disabled){transform:translateY(-1px)}
    .tower-row.active .tower-tile:not(:disabled){
      outline:2px solid rgba(229,193,88,.78);
      box-shadow:0 0 18px rgba(229,193,88,.24), 0 0 0 2px rgba(229,193,88,.10), inset 0 1px 8px rgba(255,255,255,.05);
      cursor:pointer
    }
    .tower-tile:disabled{cursor:not-allowed;filter:grayscale(.28);opacity:.74}
    .tower-tile.safe{
      background:linear-gradient(180deg,#43b16a,#1e6d3a)!important;
      color:#fff;border-color:#8ef0aa!important;opacity:1;filter:none;
      box-shadow:0 0 18px rgba(67,177,106,.28), inset 0 0 8px rgba(255,255,255,.08)
    }
    .tower-tile.bomb{
      background:linear-gradient(180deg,#c44a4a,#6a1818)!important;
      color:#fff;border-color:#ff8d8d!important;opacity:1;filter:none;
      box-shadow:0 0 18px rgba(196,74,74,.26), inset 0 0 8px rgba(255,255,255,.08)
    }
    .tower-mult{
      width:90px;text-align:center;
      background:linear-gradient(180deg,#f7e4b3,#d3aa61);
      color:#35210d;border:none;font-weight:900
    }
    .tower-help{
      text-align:center;color:rgba(255,255,255,.62);font-size:13px;
      margin-top:10px;letter-spacing:.2px
    }
    .tower-debug{
      font-size:12px;color:#edd8aa;text-align:center;margin:10px auto 0;
      display:inline-flex;justify-content:center;align-items:center;
      padding:8px 14px;border-radius:999px;
      background:rgba(0,0,0,.22);border:1px solid rgba(201,164,94,.18);
      min-width:170px
    }
    .tower-debug-wrap{text-align:center}
    .tower-config{
      display:grid;grid-template-columns:1fr;gap:8px;max-width:760px;margin:0 auto
    }

    /* FINAL tower viewport fit */
    @media(max-height:820px){
      .tower-building{padding:12px;gap:7px}
      .tower-tile{height:40px;min-width:62px;font-size:16px}
      .tower-row{gap:8px;min-height:42px}
      .settings-box{padding:10px 14px;margin-bottom:8px}
      #tower-message{font-size:18px;margin:8px 0}
      .tower-board{padding:12px}
      .tower-mult{width:72px}
    }
    @media(max-width:680px){
      .tower-building{padding:10px}
      .tower-multiplier{width:62px;font-size:12px}
      .settings-row{align-items:flex-start;gap:8px;flex-direction:column}
      .tower-row{gap:8px}
      .tower-tile{min-width:54px;height:44px;font-size:18px}
      .tower-mult{width:64px;font-size:12px}
      .tower-title{font-size:34px}
      .tower-board{padding:12px}
    }
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <button class="danger" onclick="goLobby()">🏰 Lobby</button>
    <div class="counter-display">Bank: <span class="shared-bankroll">1000 €</span></div>
    <div class="counter-display">Einsatz: <span id="betOut">10 €</span></div>
    <div class="counter-display">Cashout: <span id="winOut">0 €</span></div>
  </div>

  <section class="panel tower-shell">
    <h1 class="title tower-title">🏰 Tower Crash</h1>
    <div class="betbox">
      <label for="betSlider">Einsatz</label>
      <b id="betDisplay">10 €</b>
      <input id="betSlider" type="range">
    </div>

    <div class="seg" id="fieldBtns">
      <button class="active" data-fields="3" type="button">3 Felder</button>
      <button data-fields="4" type="button">4 Felder</button>
      <button data-fields="5" type="button">5 Felder</button>
      <button data-fields="6" type="button">6 Felder</button>
    </div>
    <div class="seg" id="bombBtns" style="margin-top:8px"></div>
    <div class="tower-help">Erst Start drücken, dann die leuchtende unterste Ebene anklicken.</div>
    <div class="tower-debug-wrap"><div class="tower-debug" id="stateOut">Status: bereit</div></div>

    <div id="tower" class="tower-board" aria-label="Tower Felder"></div>
    <div id="msg" class="message"></div>
    <div class="controls">
      <button class="success" id="startBtn" type="button">Start</button>
      <button class="primary" id="cashBtn" type="button" disabled>Cash Out</button>
    </div>
  </section>
</main>

<script>
let getBet;
let fields = 3;
let bombs = 1;
let level = 0;
let state = 'idle';
let bombMap = [];
let mults = [];
let roundBet = 0;

const el = id => document.getElementById(id);

window.addEventListener('DOMContentLoaded', () => {
  getBet = createBetSlider({
    inputId: 'betSlider',
    displayId: 'betDisplay',
    min: 1,
    max: 500,
    value: 10,
    onChange: v => { el('betOut').textContent = money(v); }
  });

  el('fieldBtns').addEventListener('click', event => {
    const btn = event.target.closest('button[data-fields]');
    if (!btn || state !== 'idle') return;
    fields = Number(btn.dataset.fields);
    if (bombs >= fields) bombs = fields - 1;
    document.querySelectorAll('#fieldBtns button').forEach(b => b.classList.toggle('active', b === btn));
    renderBombButtons();
    buildTower();
  });

  el('bombBtns').addEventListener('click', event => {
    const btn = event.target.closest('button[data-bombs]');
    if (!btn || state !== 'idle') return;
    bombs = Number(btn.dataset.bombs);
    renderBombButtons();
    buildTower();
  });

  // Delegation statt einzelner onclick-Handler: dadurch bleiben Klicks auch nach jedem Re-Render stabil.
  el('tower').addEventListener('click', event => {
    const tile = event.target.closest('.tower-tile');
    if (!tile || tile.disabled) return;
    pickTile(Number(tile.dataset.row), Number(tile.dataset.col));
  });

  el('startBtn').addEventListener('click', startTower);
  el('cashBtn').addEventListener('click', cashoutTower);

  renderBombButtons();
  buildTower();
});

function setStateText() {
  el('stateOut').textContent = state === 'play'
    ? `Status: läuft · aktive Ebene ${level + 1}/6`
    : 'Status: bereit';
}

function renderBombButtons() {
  const wrap = el('bombBtns');
  wrap.textContent = '';
  for (let i = 1; i < fields; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.bombs = String(i);
    btn.className = i === bombs ? 'active' : '';
    btn.textContent = `${i} ${i === 1 ? 'Bombe' : 'Bomben'}`;
    wrap.appendChild(btn);
  }
}

function calcMults() {
  let acc = 1;
  const step = (fields / (fields - bombs)) * 0.97;
  return Array.from({ length: 6 }, () => {
    acc *= step;
    return Number(acc.toFixed(acc < 10 ? 2 : 1));
  });
}

function buildTower() {
  mults = calcMults();
  const tower = el('tower');
  tower.textContent = '';

  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.className = 'tower-row';
    row.id = `row-${r}`;
    row.dataset.row = String(r);

    for (let c = 0; c < fields; c++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tower-tile';
      btn.dataset.row = String(r);
      btn.dataset.col = String(c);
      btn.textContent = '⚜';
      row.appendChild(btn);
    }

    const mult = document.createElement('span');
    mult.className = 'pill tower-mult';
    mult.textContent = `${mults[r]}x`;
    row.appendChild(mult);
    tower.appendChild(row);
  }
  updateRows();
}

function updateRows() {
  for (let r = 0; r < 6; r++) {
    const row = el(`row-${r}`);
    if (!row) continue;
    row.classList.remove('active', 'locked', 'passed');
    const tiles = row.querySelectorAll('.tower-tile');
    if (state !== 'play') {
      row.classList.add('locked');
      tiles.forEach(tile => { tile.disabled = true; });
    } else if (r === level) {
      row.classList.add('active');
      tiles.forEach(tile => { tile.disabled = false; });
    } else if (r < level) {
      row.classList.add('passed');
      tiles.forEach(tile => { tile.disabled = true; });
    } else {
      row.classList.add('locked');
      tiles.forEach(tile => { tile.disabled = true; });
    }
  }
  setStateText();
}

function makeBombRow() {
  const set = new Set();
  while (set.size < bombs) set.add(Math.floor(Math.random() * fields));
  return set;
}

function startTower() {
  if (state !== 'idle') return;
  const bet = Math.floor(getBet());
  if (!canAfford(bet)) return toast('Nicht genug Guthaben.', 'bad');

  roundBet = bet;
  changeCash(-roundBet);
  level = 0;
  state = 'play';
  bombMap = Array.from({ length: 6 }, makeBombRow);
  el('winOut').textContent = '0 €';
  el('msg').textContent = 'Wähle jetzt ein Feld in der leuchtenden Ebene.';
  el('startBtn').disabled = true;
  el('cashBtn').disabled = true;
  document.querySelectorAll('#fieldBtns button, #bombBtns button, #betSlider').forEach(x => { x.disabled = true; });
  buildTower();
}

function revealRow(rowIndex, clickedCol, exploded) {
  const row = el(`row-${rowIndex}`);
  if (!row) return;
  row.querySelectorAll('.tower-tile').forEach(btn => {
    const col = Number(btn.dataset.col);
    btn.disabled = true;
    if (bombMap[rowIndex].has(col)) {
      btn.classList.add('bomb');
      btn.textContent = '💣';
    } else {
      btn.classList.add('safe');
      btn.textContent = col === clickedCol || exploded ? '✅' : '⚜';
    }
  });
}

function pickTile(r, c) {
  if (state !== 'play' || r !== level) return;

  if (bombMap[r].has(c)) {
    revealRow(r, c, true);
    el('msg').textContent = 'Boom! Einsatz verloren.';
    recordGame('Tower', -roundBet);
    endTowerRound(false);
    return;
  }

  revealRow(r, c, false);
  level++;
  const cashout = Math.floor(roundBet * mults[level - 1]);
  el('winOut').textContent = money(cashout);
  el('cashBtn').disabled = false;

  if (level >= 6) {
    cashoutTower();
    return;
  }

  el('msg').textContent = `Sicher! Cashout für ${money(cashout)} oder weiter nach oben.`;
  updateRows();
}

function cashoutTower() {
  if (state !== 'play' || level <= 0) return;
  const win = Math.floor(roundBet * mults[level - 1]);
  changeCash(win);
  recordGame('Tower', win - roundBet);
  el('msg').textContent = `Ausgezahlt: ${money(win)} 🎉`;
  endTowerRound(true);
}

function endTowerRound(won) {
  state = 'idle';
  el('startBtn').disabled = false;
  el('cashBtn').disabled = true;
  document.querySelectorAll('#fieldBtns button, #bombBtns button, #betSlider').forEach(x => { x.disabled = false; });
  updateRows();
  setTimeout(() => {
    el('winOut').textContent = '0 €';
    buildTower();
  }, won ? 1300 : 1700);
}
</script>
</body>
</html>
