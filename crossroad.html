<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cross Road</title>
<link rel="stylesheet" href="styles.css">
<script src="casino-utils.js"></script>
<style>
  body{background:radial-gradient(circle at 50% 8%,#9ec8d6 0%,#31505d 28%,#172934 54%,#081016 100%)}
  .cross-shell{max-width:980px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(145deg,#263d49,#0e1920);border:2px solid #c9a45e;box-shadow:0 26px 60px rgba(0,0,0,.58),0 0 34px rgba(201,164,94,.15)}
  .cross-shell:before{content:"ROYAL CROSSING";position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:4px;color:#f1ddaf;opacity:.74;font-weight:900}
  .cross-title{font-size:38px;margin-top:12px;background:linear-gradient(#f7e4b3,#d3aa61,#8e6523);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
  .cross-help{text-align:center;color:rgba(255,255,255,.64);font-size:13px;margin:10px auto 0;max-width:780px;letter-spacing:.2px}
  .status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px auto;max-width:820px}.status-grid .counter-display{text-align:center;border-radius:16px}
  .seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px auto 0}.seg button.active{background:linear-gradient(#d8bb55,#9c7620);color:#181008;border-color:#ffe9a4}

  .cross-board{position:relative;max-width:860px;height:440px;margin:18px auto 8px;padding:18px;border-radius:28px;background:linear-gradient(180deg,#101c21,#162a31 58%,#0d1519 100%);border:2px solid rgba(201,164,94,.26);box-shadow:inset 0 0 30px rgba(0,0,0,.55),0 0 18px rgba(201,164,94,.08);overflow:hidden}
  .cross-board:before{content:"";position:absolute;inset:12px;border-radius:22px;border:1px solid rgba(241,221,175,.06);pointer-events:none;z-index:20}
  .cross-board:after{content:"FINISH";position:absolute;right:24px;top:26px;bottom:26px;width:38px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:4px;font-size:12px;font-weight:950;color:#1d1206;background:linear-gradient(180deg,#f7e4b3,#d3aa61);border-radius:999px;box-shadow:0 8px 18px rgba(0,0,0,.28);z-index:9}
  .map{position:absolute;inset:18px;display:grid;grid-template-columns:84px repeat(9,1fr);gap:8px;z-index:2}
  .lane{position:relative;border-radius:18px;overflow:hidden;min-width:0;background:linear-gradient(180deg,#323941,#171d23);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 0 14px rgba(0,0,0,.38)}
  .lane.start{background:linear-gradient(180deg,#43b16a,#1e6d3a);border-color:rgba(142,240,170,.55)}
  .lane.safe{background:linear-gradient(180deg,#367447,#174629);border-color:rgba(142,240,170,.22)}
  .lane.current{outline:2px solid rgba(229,193,88,.88);box-shadow:0 0 20px rgba(229,193,88,.22),inset 0 0 14px rgba(0,0,0,.35)}
  .lane.road:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,rgba(255,255,255,.42) 0 28px,transparent 28px 52px);opacity:.5}
  .lane.water{background:linear-gradient(180deg,#2a6f87,#123948);border-color:rgba(132,213,233,.18)}
  .lane.water:after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.09) 0 2px,transparent 2px 18px);opacity:.35;animation:waterMove 2.8s linear infinite}
  @keyframes waterMove{from{transform:translateY(0)}to{transform:translateY(24px)}}
  .lane-mult{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;font-size:12px;font-weight:950;color:#1d1206;background:linear-gradient(180deg,#f7e4b3,#d3aa61);border-radius:999px;padding:5px 8px;min-width:54px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.28)}

  .chicken{position:absolute;left:0;top:50%;font-size:48px;z-index:14;filter:drop-shadow(0 8px 10px rgba(0,0,0,.42));transform:translate(-50%,-50%);transition:transform .16s ease;will-change:left,top,transform}
  .chicken.hop{transform:translate(-50%,-62%) scale(1.08) rotate(-4deg)}
  .chicken.walk{animation:chickenRun .18s ease-in-out infinite alternate}
  @keyframes chickenRun{from{transform:translate(-50%,-53%) rotate(-5deg) scale(1.04)}to{transform:translate(-50%,-61%) rotate(5deg) scale(1.10)}}
  .chicken.crash{animation:crashWobble .62s ease both}
  .chicken.win{animation:winDance .75s ease infinite alternate}
  @keyframes crashWobble{0%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-50%,-72%) rotate(-20deg)}55%{transform:translate(-50%,-44%) rotate(18deg)}100%{transform:translate(-50%,-50%) rotate(0) scale(.9);filter:grayscale(.4) drop-shadow(0 8px 10px rgba(0,0,0,.42))}}
  @keyframes winDance{from{transform:translate(-50%,-52%) rotate(-6deg) scale(1.04)}to{transform:translate(-50%,-60%) rotate(6deg) scale(1.10)}}

  .vehicle{position:absolute;left:50%;top:-72px;transform:translateX(-50%);font-size:34px;z-index:5;filter:drop-shadow(0 6px 8px rgba(0,0,0,.38));animation:driveDown linear infinite;will-change:top}
  .vehicle.up{top:calc(100% + 72px);animation-name:driveUp}
  @keyframes driveDown{from{top:-72px}to{top:calc(100% + 72px)}}
  @keyframes driveUp{from{top:calc(100% + 72px)}to{top:-72px}}
  .vehicle.fast{filter:drop-shadow(0 8px 10px rgba(0,0,0,.45)) blur(.2px)}
  .vehicle.hit{animation:none!important;top:50%!important;transform:translate(-50%,-50%) scale(1.16);z-index:16}

  .water-log{
    position:absolute;
    left:50%;
    top:-96px;
    transform:translateX(-50%);
    z-index:5;
    min-width:42px;
    padding:8px 5px;
    border-radius:999px;
    font-size:30px;
    line-height:1;
    text-align:center;
    letter-spacing:-10px;
    color:#8a5526;
    background:linear-gradient(180deg,#b97938,#6b3d18);
    border:1px solid rgba(255,224,160,.24);
    box-shadow:inset 0 2px 5px rgba(255,255,255,.18), inset 0 -8px 10px rgba(0,0,0,.2), 0 6px 10px rgba(0,0,0,.32);
    animation:floatDown linear infinite;
    will-change:top,transform;
  }
  .water-log:before,.water-log:after{content:"";position:absolute;left:8px;right:8px;height:2px;border-radius:999px;background:rgba(70,34,12,.32)}
  .water-log:before{top:10px}
  .water-log:after{bottom:10px}
  .water-log.up{top:calc(100% + 96px);animation-name:floatUp}
  .water-log.long{min-width:54px}
  .water-log.xlong{min-width:68px}
  @keyframes floatDown{from{top:-96px;transform:translateX(-50%) rotate(-2deg)}50%{transform:translateX(-50%) rotate(2deg)}to{top:calc(100% + 96px);transform:translateX(-50%) rotate(-2deg)}}
  @keyframes floatUp{from{top:calc(100% + 96px);transform:translateX(-50%) rotate(2deg)}50%{transform:translateX(-50%) rotate(-2deg)}to{top:-96px;transform:translateX(-50%) rotate(2deg)}}
  .water-splash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;z-index:17;animation:sparkPop .48s ease both;pointer-events:none}

  .spark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:52px;z-index:17;animation:sparkPop .48s ease both;pointer-events:none}
  @keyframes sparkPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(14deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.72) rotate(-10deg)}}
  .dust{position:absolute;left:0;top:50%;width:14px;height:14px;border-radius:999px;background:rgba(241,221,175,.55);z-index:12;animation:dust .52s ease-out forwards;pointer-events:none}
  @keyframes dust{to{opacity:0;transform:translate(-18px,-20px) scale(2.2)}}
  .cross-history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:820px;margin:10px auto 0}.cross-history span{font-size:12px;font-weight:900;border-radius:999px;padding:5px 9px;background:rgba(0,0,0,.32);border:1px solid rgba(229,193,88,.18);color:#f0cc77}.cross-history .loss{color:#ff9b9b;border-color:rgba(255,120,120,.34)}.cross-history .win{color:#93f0ae;border-color:rgba(147,240,174,.34)}
  @media(max-height:820px){.cross-board{height:350px}.chicken{font-size:40px}.cross-title{font-size:34px}#msg{font-size:18px;margin:8px 0}.vehicle{font-size:28px}.water-log{font-size:26px}.lane-mult{font-size:10px;min-width:46px}}
  @media(max-width:760px){.cross-board{height:350px;padding:12px}.map{inset:12px;grid-template-columns:58px repeat(9,1fr);gap:5px}.lane{border-radius:14px}.lane-mult{font-size:9px;min-width:40px;padding:4px 5px}.chicken{font-size:36px}.vehicle{font-size:26px}.water-log{font-size:24px}.cross-board:after{display:none}}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <button class="danger" onclick="goLobby()">🏰 Lobby</button>
    <div class="counter-display">Bank: <span class="shared-bankroll">1000 €</span></div>
    <div class="counter-display">Einsatz: <span id="betOut">10 €</span></div>
    <div class="counter-display">Möglicher Gewinn: <span id="potentialOut">0 €</span></div>
  </div>

  <section class="panel cross-shell">
    <h1 class="title cross-title">🐔 Cross Road</h1>
    <div class="betbox">
      <label for="betSlider">Einsatz</label>
      <b id="betDisplay">10 €</b>
      <input id="betSlider" type="range">
    </div>
    <div class="seg" id="riskBtns">
      <button class="active" data-risk="easy" type="button">Sicher</button>
      <button data-risk="normal" type="button">Normal</button>
      <button data-risk="hard" type="button">Riskant</button>
    </div>
    <div class="cross-help">Das Chicken startet links und läuft nach rechts. Jede sichere Spur erhöht den Multiplikator. Cashout, bevor Auto oder Wasser dich erwischt.</div>

    <div class="status-grid">
      <div class="counter-display">Schritt: <span id="levelOut">0 / 9</span></div>
      <div class="counter-display">Multiplikator: <span id="multOut">1.00x</span></div>
      <div class="counter-display">Status: <span id="stateOut">bereit</span></div>
    </div>

    <div class="cross-board" id="board">
      <div class="map" id="map"></div>
      <div class="chicken" id="chicken">🐔</div>
    </div>
    <div class="cross-history" id="history"></div>
    <div id="msg" class="message"></div>
    <div class="controls">
      <button class="success" id="startBtn" type="button">Start</button>
      <button class="primary" id="stepBtn" type="button" disabled>Weiter nach rechts</button>
      <button class="success" id="cashBtn" type="button" disabled>Cashout</button>
    </div>
  </section>
</main>

<script>
let getBet;
let risk = 'easy';
let activeBet = 0;
let level = 0;
let inRound = false;
let busy = false;
const maxLevel = 9;
const historyItems = [];
const vehicles = ['🚗','🚕','🚙','🚓','🚑','🚚','🚛','🏎️','🚐','🚌'];
const settings = {
  easy:   { chance: .86, mult: [1.12,1.26,1.43,1.62,1.86,2.14,2.48,2.90,3.40] },
  normal: { chance: .78, mult: [1.20,1.48,1.83,2.27,2.84,3.58,4.55,5.85,7.60] },
  hard:   { chance: .68, mult: [1.35,1.88,2.63,3.70,5.25,7.55,10.95,16.05,23.80] }
};
const map = document.getElementById('map');
const board = document.getElementById('board');
const chicken = document.getElementById('chicken');
const msg = document.getElementById('msg');
let ambientTimers = [];

function currentMult(){ return level <= 0 ? 1 : settings[risk].mult[level - 1]; }
function potential(){ return Math.floor(activeBet * currentMult()); }
function laneCenterX(lvl){
  const lane = map.querySelector(`[data-lane="${lvl}"]`);
  if (!lane) return 0;
  const b = board.getBoundingClientRect();
  const r = lane.getBoundingClientRect();
  return (r.left - b.left) + r.width / 2;
}
function randomVehicle(){ return vehicles[Math.floor(Math.random() * vehicles.length)]; }
function randomLogClass(){
  const r = Math.random();
  if (r > .72) return ' xlong';
  if (r > .38) return ' long';
  return '';
}
function addDust(){
  const d = document.createElement('div');
  d.className = 'dust';
  d.style.left = chicken.style.left;
  d.style.top = chicken.style.top || '50%';
  board.appendChild(d);
  setTimeout(() => d.remove(), 550);
}
function easeInOutCubic(t){
  return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}
function animateChickenTo(targetX, duration = 720){
  return new Promise(resolve => {
    const startX = parseFloat(chicken.style.left) || laneCenterX(level);
    const boardH = board.clientHeight || 440;
    const baseY = boardH * .5;
    const jump = Math.max(34, Math.min(58, boardH * .12));
    let t0 = null;
    chicken.classList.add('walk');
    function frame(ts){
      if (!t0) t0 = ts;
      const raw = Math.min(1, (ts - t0) / duration);
      const e = easeInOutCubic(raw);
      const hop = Math.sin(raw * Math.PI) * jump;
      chicken.style.left = (startX + (targetX - startX) * e) + 'px';
      chicken.style.top = (baseY - hop) + 'px';
      if (raw < 1) requestAnimationFrame(frame);
      else {
        chicken.classList.remove('walk');
        chicken.style.left = targetX + 'px';
        chicken.style.top = '50%';
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}
function clearLaneVehicles(laneIndex){
  const lane = map.querySelector(`[data-lane="${laneIndex}"]`);
  if (!lane) return;
  lane.querySelectorAll('.vehicle').forEach(v => v.remove());
}
function renderBoard(){
  stopAmbientTraffic();
  map.innerHTML = '';
  const mults = settings[risk].mult;
  for (let i = 0; i <= maxLevel; i++) {
    const lane = document.createElement('div');
    const isWater = i > 0 && i % 4 === 0;
    lane.className = 'lane ' + (i === 0 ? 'start' : (isWater ? 'water' : 'road'));
    lane.dataset.lane = i;
    if (i > 0) lane.innerHTML = `<span class="lane-mult">${mults[i - 1].toFixed(2)}x</span>`;
    map.appendChild(lane);
  }
  updateVisuals();
  startAmbientTraffic();
}
function updateVisuals(){
  [...map.children].forEach(lane => {
    const i = Number(lane.dataset.lane);
    lane.classList.toggle('safe', i <= level && i !== 0);
    lane.classList.toggle('current', inRound && i === level + 1);
  });
  chicken.style.left = laneCenterX(level) + 'px';
  chicken.style.top = '50%';
  document.getElementById('levelOut').textContent = `${level} / ${maxLevel}`;
  document.getElementById('multOut').textContent = currentMult().toFixed(2) + 'x';
  document.getElementById('potentialOut').textContent = inRound ? money(potential()) : '0 €';
}
function setButtons(){
  document.getElementById('startBtn').disabled = inRound || busy;
  document.getElementById('stepBtn').disabled = !inRound || busy || level >= maxLevel;
  document.getElementById('cashBtn').disabled = !inRound || busy || level <= 0;
  document.querySelectorAll('#riskBtns button').forEach(b => b.disabled = inRound || busy);
  const slider = document.getElementById('betSlider');
  if (slider) slider.disabled = inRound || busy;
}
function setState(text){ document.getElementById('stateOut').textContent = text; }
function addHistory(text, cls){
  historyItems.unshift({ text, cls });
  historyItems.splice(8);
  document.getElementById('history').innerHTML = historyItems.map(h => `<span class="${h.cls}">${h.text}</span>`).join('');
}
function startGame(){
  const bet = getBet();
  if (!canAfford(bet)) { msg.textContent = 'Nicht genug Guthaben.'; return; }
  activeBet = bet;
  changeCash(-activeBet);
  level = 0;
  inRound = true;
  busy = false;
  msg.textContent = 'Das Chicken startet links. Nächster Schritt nach rechts?';
  chicken.textContent = '🐔';
  chicken.className = 'chicken';
  setState('läuft');
  updateVisuals();
  clearLaneVehicles(level);
  clearLaneVehicles(level + 1);
  setButtons();
}
function spawnAmbientVehicle(laneIndex){
  if (busy) return;
  const lane = map.querySelector(`[data-lane="${laneIndex}"]`);
  if (!lane) return;

  // Fairness/Optik: Auf der Spur, auf der das Chicken steht,
  // und auf der direkt nächsten Zielspur spawnen keine Ambient-Objekte.
  if (inRound && (laneIndex === level || laneIndex === level + 1)) return;
  if (!inRound && laneIndex === level) return;

  if (lane.classList.contains('water')) {
    const log = document.createElement('div');
    const up = Math.random() > .5;
    const duration = 2600 + Math.random() * 1900;
    log.className = 'water-log ambient' + (up ? ' up' : '') + randomLogClass();
    log.textContent = '🪵';
    log.style.animationDuration = duration + 'ms';
    lane.appendChild(log);
    setTimeout(() => log.remove(), duration + 140);
    return;
  }

  if (!lane.classList.contains('road')) return;
  const v = document.createElement('div');
  const up = Math.random() > .5;
  const duration = 1400 + Math.random() * 1300;
  v.className = 'vehicle ambient' + (up ? ' up' : '') + (duration < 1900 ? ' fast' : '');
  v.textContent = randomVehicle();
  v.style.animationDuration = duration + 'ms';
  v.style.animationDelay = '0ms';
  lane.appendChild(v);
  setTimeout(() => v.remove(), duration + 120);
}
function startAmbientTraffic(){
  ambientTimers = [];
  for (let i = 1; i <= maxLevel; i++) {
    const loop = () => {
      spawnAmbientVehicle(i);
      const timer = setTimeout(loop, 1400 + Math.random() * 2400);
      ambientTimers.push(timer);
    };
    const timer = setTimeout(loop, 200 + Math.random() * 1300);
    ambientTimers.push(timer);
  }
}
function stopAmbientTraffic(){
  ambientTimers.forEach(clearTimeout);
  ambientTimers = [];
  map.querySelectorAll('.vehicle,.water-log').forEach(v => v.remove());
}
function crossingVehicle(laneIndex, willHit){
  return new Promise(resolve => {
    const lane = map.querySelector(`[data-lane="${laneIndex}"]`);
    const isWater = lane && lane.classList.contains('water');

    if (isWater) {
      const log = document.createElement('div');
      const up = Math.random() > .5;
      log.className = 'water-log' + (up ? ' up' : '') + randomLogClass();
      log.textContent = '🪵';
      log.style.animationDuration = willHit ? '980ms' : '1220ms';
      lane.appendChild(log);

      setTimeout(() => {
        if (willHit) {
          const s = document.createElement('div');
          s.className = 'water-splash';
          s.textContent = '💦';
          lane.appendChild(s);
          chicken.textContent = '🐔';
          chicken.classList.add('crash');
          setTimeout(() => s.remove(), 520);
        }
      }, willHit ? 430 : 700);

      setTimeout(() => { log.remove(); resolve(); }, willHit ? 1120 : 1340);
      return;
    }

    const v = document.createElement('div');
    const up = Math.random() > .5;
    v.className = 'vehicle fast' + (up ? ' up' : '');
    v.textContent = randomVehicle();
    v.style.animationDuration = willHit ? '620ms' : '820ms';
    lane.appendChild(v);
    setTimeout(() => {
      if (willHit) {
        v.classList.add('hit');
        const s = document.createElement('div');
        s.className = 'spark';
        s.textContent = '💥';
        lane.appendChild(s);
        chicken.textContent = '🐔';
        chicken.classList.add('crash');
        setTimeout(() => s.remove(), 520);
      }
    }, willHit ? 290 : 520);
    setTimeout(() => { v.remove(); resolve(); }, willHit ? 760 : 940);
  });
}
async function nextStep(){
  if (!inRound || busy || level >= maxLevel) return;
  busy = true; setButtons();
  const target = level + 1;
  const safe = Math.random() < settings[risk].chance;

  // Während das Chicken die Spur überquert, wird der Verkehr komplett pausiert.
  // Dadurch fahren keine Autos mehr hin und her, während die Übergangsanimation läuft.
  stopAmbientTraffic();
  clearLaneVehicles(target);

  msg.textContent = 'Das Chicken rennt nach rechts...';
  setState('überquert');
  addDust();
  await animateChickenTo(laneCenterX(target), 760);

  if (!safe) {
    await crossingVehicle(target, true);
    const lost = activeBet;
    inRound = false; busy = false;
    msg.textContent = `Crash! Einsatz verloren: ${money(lost)}`;
    setState('verloren');
    addHistory('-' + money(lost), 'loss');
    activeBet = 0;
    updateVisuals(); setButtons();
    startAmbientTraffic();
    try { recordGame('Cross Road', -lost); } catch(e) {}
    return;
  }

  level = target;
  if (level >= maxLevel) chicken.classList.add('win');
  msg.textContent = level >= maxLevel ? 'Ziel erreicht! Jetzt den Gewinn sichern.' : 'Sicher rüber. Weiter oder cashout?';
  setState('sicher');
  updateVisuals();
  clearLaneVehicles(level);
  clearLaneVehicles(level + 1);
  busy = false; setButtons();
  startAmbientTraffic();
}
function cashout(){
  if (!inRound || busy || level <= 0) return;
  const win = potential();
  const profit = win - activeBet;
  changeCash(win);
  addHistory('+' + money(win), 'win');
  msg.textContent = `Cashout: ${money(win)} bei ${currentMult().toFixed(2)}x`;
  setState('ausgezahlt');
  chicken.classList.add('win');
  inRound = false; activeBet = 0;
  updateVisuals(); setButtons();
  try { recordGame('Cross Road', profit); } catch(e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  getBet = createBetSlider({ inputId:'betSlider', displayId:'betDisplay', min:1, max:500, value:10, onChange:v => { document.getElementById('betOut').textContent = money(v); } });
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('stepBtn').addEventListener('click', nextStep);
  document.getElementById('cashBtn').addEventListener('click', cashout);
  document.querySelectorAll('#riskBtns button').forEach(btn => btn.addEventListener('click', () => {
    risk = btn.dataset.risk;
    document.querySelectorAll('#riskBtns button').forEach(b => b.classList.toggle('active', b === btn));
    renderBoard(); updateVisuals();
  }));
  renderBoard(); setButtons();
});
window.addEventListener('resize', updateVisuals);
</script>
</body>
</html>
