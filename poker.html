<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Texas Hold'em Poker</title>
<link rel="stylesheet" href="styles.css">
<script src="casino-utils.js"></script>
<style>
  .poker-shell{margin-top:16px}
  .poker-table{
    position:relative;
    background:
      radial-gradient(ellipse at center, rgba(32,118,70,.98) 0%, rgba(9,61,35,.99) 48%, rgba(70,48,28,.98) 49%, rgba(38,22,13,.99) 63%, rgba(16,10,7,1) 76%, rgba(5,4,3,1) 100%);
    border:4px solid rgba(123,81,40,.95);
    border-radius:140px;
    padding:34px 28px 28px;
    margin-top:18px;
    overflow:hidden;
    box-shadow:
      inset 0 0 95px rgba(0,0,0,.55),
      inset 0 0 0 10px rgba(111,74,38,.7),
      inset 0 0 0 18px rgba(26,16,10,.92),
      0 28px 65px rgba(0,0,0,.58);
  }
  .poker-table:before{
    content:"NO LIMIT TEXAS HOLD'EM";
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:4px;color:rgba(255,236,176,.88);font-weight:900;
    background:rgba(0,0,0,.28);border:1px solid rgba(229,193,88,.45);padding:7px 16px;border-radius:999px;
    box-shadow:0 5px 12px rgba(0,0,0,.25);
  }
  .poker-table:after{
    content:"";
    position:absolute;inset:16px 22px;
    border-radius:130px;
    border:2px solid rgba(229,193,88,.18);
    pointer-events:none;
  }
  .board-panel{
    position:relative;
    background:rgba(4,35,18,.22);
    border:2px solid rgba(229,193,88,.18);
    border-radius:88px;
    padding:22px 20px 18px;
    text-align:center;
    max-width:760px;
    margin:26px auto 14px;
    box-shadow:inset 0 0 28px rgba(0,0,0,.34);
  }
  .board-panel:before{
    content:"COMMUNITY";
    position:absolute;
    top:-12px;left:50%;transform:translateX(-50%);
    font-size:11px;font-weight:900;letter-spacing:3px;
    color:rgba(255,236,176,.86);
    background:rgba(6,26,15,.92);
    border:1px solid rgba(229,193,88,.35);
    padding:4px 12px;border-radius:999px;
  }
  .board-wrap .hand-zone{min-height:150px;margin:10px 0 10px}
  .community-title{color:var(--gold);font-size:20px;font-weight:900;letter-spacing:1px;margin:2px 0 8px}
  .poker-centerline{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .seat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:18px}
  .seat{
    background:linear-gradient(180deg, rgba(33,22,16,.9), rgba(17,12,9,.95));
    border:1px solid rgba(148,106,60,.45);
    border-radius:30px 30px 20px 20px;
    padding:14px 12px 12px;
    text-align:center;
    position:relative;
    min-height:214px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 22px rgba(0,0,0,.22);
  }
  .seat:before{
    content:"";
    position:absolute;left:12px;right:12px;top:8px;height:8px;
    border-radius:999px;
    background:linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.18), rgba(255,255,255,.04));
  }
  .seat.you{border-color:rgba(229,193,88,.56)}
  .seat.active-turn{outline:2px solid var(--gold);box-shadow:0 0 0 3px rgba(229,193,88,.16),0 0 26px rgba(229,193,88,.26), inset 0 1px 0 rgba(255,255,255,.06)}
  .seat.folded{opacity:.48;filter:grayscale(.45)}
  .seat.winner{outline:3px solid #7dff9e;box-shadow:0 0 0 3px rgba(125,255,158,.16),0 0 28px rgba(125,255,158,.28)}
  .seat h3{margin:0 0 8px;color:#f2d889;font-size:16px;text-transform:uppercase;letter-spacing:1px}
  .seat .hand-zone{min-height:98px;margin:2px 0 4px}
  .seat .card{width:62px;height:90px;margin-right:-18px}
  .seat .suit{font-size:30px}
  .seat .court-card{inset:6px 4px}.seat .court-divider{width:14px;height:14px;font-size:9px}.seat .court-crown{font-size:8px}.seat .court-head{width:11px;height:11px}.seat .court-head:before,.seat .court-head:after{top:4px;width:2px;height:2px}.seat .court-head:before{left:3px}.seat .court-head:after{right:3px}.seat .court-head span{bottom:1px;width:4px;height:2px}.seat .court-collar{width:15px;height:4px}.seat .court-torso{width:20px;height:13px}.seat .court-torso i{font-size:8px;top:1px}.seat .court-torso em{font-size:5px;right:2px;bottom:0}.seat .ace-mark{font-size:14px}.seat .ace-suit{font-size:16px}.seat .pip-layout{inset:11px 8px}.seat .pip-layout .pip{font-size:10px;width:10px;height:10px}

  .seat .corner{font-size:12px}
  .seat-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .seat-meta .score-badge{font-size:12px;background:rgba(0,0,0,.42)}
  .role-badge{position:absolute;top:12px;right:12px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:950;color:#1a1208;background:linear-gradient(#ffe68f,#c89a2b);box-shadow:0 4px 10px rgba(0,0,0,.35)}
  .action-panel{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px;margin-top:14px}
  .raisebox{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;max-width:560px;margin:12px auto 0}
  .raisebox input{grid-column:1/-1;width:100%;accent-color:#e5c158}
  .log{max-height:140px;overflow:auto;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;margin-top:12px;font-size:13px;color:rgba(255,255,255,.8)}
  .auto-note{font-size:12px;color:rgba(255,255,255,.6);text-align:center;margin-top:10px;letter-spacing:.2px}
  @media(max-width:780px){
    .poker-table{border-radius:48px;padding:28px 16px 18px}
    .poker-table:after{border-radius:38px;inset:12px}
    .board-panel{border-radius:30px}
  }

  /* Poker re-rendert bei Bot-Aktionen oft. Ohne diese Regel startet die globale .card-pop Animation jedes Mal neu. */
  .poker-table .card,
  .poker-table .card.hidden,
  .poker-table .hand-zone .card,
  .poker-table .seat .card,
  .poker-table #board .card{
    animation:none !important;
  }

  /* FINAL poker viewport fit */
  .poker-table .card,
  .poker-table .card.hidden,
  .poker-table .hand-zone .card,
  .poker-table .seat .card,
  .poker-table #board .card{animation:none !important}
  @media(max-height:820px){
    .poker-table{padding:24px 14px 14px;border-radius:70px}
    .poker-table:before{top:10px;font-size:10px;padding:4px 10px}
    .poker-table:after{inset:10px 14px;border-radius:60px}
    .board-panel{padding:14px 12px 10px;margin:16px auto 8px;border-radius:42px}
    .board-wrap .hand-zone{min-height:88px}
    .seat-grid{gap:8px;margin-top:8px}
    .seat{min-height:132px;padding:10px 8px 8px;border-radius:18px}
    .seat h3{font-size:12px;margin-bottom:4px}
    .seat .hand-zone{min-height:58px}
    .seat .card{width:42px;height:60px;margin-right:-12px}
    .seat .suit{font-size:20px}.seat .corner{font-size:9px}
    .seat-meta{gap:4px;margin-top:4px}
    .seat-meta .score-badge{font-size:10px;padding:3px 6px}
    .role-badge{font-size:9px;top:6px;right:6px;padding:2px 6px}
    .action-panel{padding:9px;margin-top:8px}
    .log{max-height:68px;font-size:11px;padding:6px}
    .auto-note{display:none}
    .raisebox{margin-top:8px}
  }
  @media(max-width:760px){
    .poker-table{border-radius:36px;padding:28px 10px 12px}
    .poker-table:after{border-radius:28px;inset:9px}
    .board-panel{border-radius:24px;padding:14px 8px}
    .seat-grid{grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr))}
  }


  /* Clean poker blind setup */
  .blind-setup{
    max-width:820px;
    margin:8px auto 14px;
    padding:14px;
    border-radius:22px;
    background:linear-gradient(180deg,rgba(10,28,19,.68),rgba(0,0,0,.28));
    border:1px solid rgba(229,193,88,.22);
    box-shadow:inset 0 0 22px rgba(0,0,0,.25);
  }
  .blind-title{display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:var(--gold);font-weight:950;letter-spacing:.7px;text-transform:uppercase}
  .blind-title small{color:rgba(255,255,255,.62);font-size:12px;text-transform:none;font-weight:700;letter-spacing:0}
  .blind-presets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .blind-presets button{
    border-radius:16px;
    padding:10px 8px;
    background:linear-gradient(180deg,rgba(44,34,23,.98),rgba(18,13,9,.98));
    border:1px solid rgba(229,193,88,.18);
    color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 16px rgba(0,0,0,.22);
  }
  .blind-presets button small{display:block;color:rgba(255,255,255,.62);font-size:11px;font-weight:800;margin-bottom:3px}
  .blind-presets button b{display:block;color:#ffe08a;font-size:15px}
  .blind-presets button.active{
    border-color:rgba(229,193,88,.72);
    background:linear-gradient(180deg,rgba(92,67,25,.98),rgba(32,22,10,.98));
    box-shadow:0 0 0 3px rgba(229,193,88,.16),0 0 24px rgba(229,193,88,.18),inset 0 1px 0 rgba(255,255,255,.12);
  }
  .blind-summary{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .blind-summary span{padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.72);font-weight:800}
  .blind-summary b{color:var(--gold)}
  @media(max-width:760px){
    .blind-presets{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
    .blind-setup{padding:11px;border-radius:18px}
  }
  @media(max-height:760px){
    .blind-setup{margin:6px auto 8px;padding:10px}
    .blind-presets button{padding:7px 6px}
    .blind-presets button b{font-size:13px}
    .blind-summary{margin-top:7px}
  }

</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <button class="danger" onclick="goLobby()">🏰 Lobby</button>
    <div class="counter-display">Bank: <span class="shared-bankroll">1000 €</span></div>
    <div class="counter-display">Street: <span id="streetOut">Bereit</span></div>
  </div>

  <section class="panel poker-shell">
    <h1 class="title" style="font-size:38px">♣ Texas Hold'em Poker</h1>
    <div class="blind-setup" id="blindSetup">
      <div class="blind-title">
        <span>Tischlimit</span>
        
      </div>
      <div class="blind-presets" id="blindPresets">
        <button type="button" data-bb="4"><small>Casual</small><b>2 / 4 €</b></button>
        <button type="button" data-bb="10" class="active"><small>Classic</small><b>5 / 10 €</b></button>
        <button type="button" data-bb="20"><small>Royal</small><b>10 / 20 €</b></button>
        <button type="button" data-bb="50"><small>High Roller</small><b>25 / 50 €</b></button>
        <button type="button" data-bb="100"><small>VIP</small><b>50 / 100 €</b></button>
      </div>
      <div class="blind-summary">
        <span>Small Blind <b id="smallBlindPreview">5 €</b></span>
        <span>Big Blind <b id="bigBlindPreview">10 €</b></span>
      </div>
    </div>
    <div class="seg" id="botBtns">
      <button class="active" data-bots="1" type="button">1 Bot</button>
      <button data-bots="2" type="button">2 Bots</button>
      <button data-bots="3" type="button">3 Bots</button>
      <button data-bots="4" type="button">4 Bots</button>
    </div>

    <div class="poker-table">
      <div class="board-panel board-wrap">
        <div class="community-title">Community Cards</div>
        <div id="board" class="hand-zone"></div>
        <div class="poker-centerline">
          <span class="pill">Pot: <b id="potOut">0 €</b></span>
          <span class="pill">Aktueller Einsatz: <b id="currentBetOut">0 €</b></span>
          <span class="pill">Zu zahlen: <b id="toCallOut">0 €</b></span>
        </div>
      </div>
      <div id="seats" class="seat-grid"></div>
    </div>

    <div id="msg" class="message"></div>
    <div class="action-panel">
      <div class="controls">
        <button class="success" id="startBtn" type="button">Neue Hand</button>
        <button id="foldBtn" type="button" disabled>Fold</button>
        <button class="success" id="callBtn" type="button" disabled>Check</button>
        <button class="primary" id="raiseBtn" type="button" disabled>Bet/Raise</button>
      </div>
      <div class="raisebox">
        <label for="raiseSlider" style="color:var(--gold);font-weight:800">Bet/Raise Zusatzbetrag</label>
        <b id="raiseDisplay">10 €</b>
        <input id="raiseSlider" type="range" min="1" max="500" step="1" value="10">
      </div>
      <div class="chip-rack" id="raiseChips">
  <button type="button" class="chip-btn chip-white" data-chip="5">5</button>
  <button type="button" class="chip-btn chip-red" data-chip="10">10</button>
  <button type="button" class="chip-btn chip-green" data-chip="25">25</button>
  <button type="button" class="chip-btn chip-black" data-chip="50">50</button>
  <button type="button" class="chip-btn chip-gold" data-chip="100">100</button>
</div>
      <div class="auto-note">Bots handeln automatisch. Wenn eine Setzrunde fertig ist, werden Flop, Turn, River und Showdown automatisch aufgedeckt.</div>
      <div id="log" class="log"></div>
    </div>
  </section>
</main>

<script>
let getBlind;
let selectedBigBlind = 10;
let botCount = 1;
let players = [];
let deck = [];
let boardCards = [];
let street = 'idle';
let pot = 0;
let currentBet = 0;
let bigBlind = 10;
let smallBlind = 5;
let handDone = false;
let logLines = [];
let autoTimer = null;
let activeIndex = -1;
let dealerIndex = -1;
let handNumber = 0;
let botStacks = [1000, 1000, 1000, 1000];

const STREET_LABELS = { idle:'Bereit', preflop:'Preflop', flop:'Flop', turn:'Turn', river:'River', showdown:'Showdown' };
const el = id => document.getElementById(id);

window.addEventListener('DOMContentLoaded', () => {
  const raiseSlider = el('raiseSlider');
  getBlind = () => selectedBigBlind;
  const applyChip = (slider, value) => { slider.value = String(Math.max(Number(slider.min||1), Math.min(Number(slider.max||500), Number(slider.value||0) + (Number(value)||0)))); slider.dispatchEvent(new Event('input')); };
  const updateBlindPreview = () => {
    el('smallBlindPreview').textContent = money(Math.max(1, Math.floor(selectedBigBlind / 2)));
    el('bigBlindPreview').textContent = money(selectedBigBlind);
  };
  el('blindPresets').addEventListener('click', e => {
    const btn = e.target.closest('button[data-bb]');
    if (!btn || isHandActive()) return;
    selectedBigBlind = Math.max(2, Math.floor(Number(btn.dataset.bb) || 10));
    document.querySelectorAll('#blindPresets button').forEach(b => b.classList.toggle('active', b === btn));
    updateBlindPreview();
    render();
  });
  updateBlindPreview();
  el('raiseChips').addEventListener('click', e => { const b = e.target.closest('button[data-chip]'); if (!b) return; applyChip(raiseSlider, b.dataset.chip); });
  el('botBtns').addEventListener('click', e => {
    const btn = e.target.closest('button[data-bots]');
    if (!btn || isHandActive()) return;
    botCount = Number(btn.dataset.bots);
    document.querySelectorAll('#botBtns button').forEach(b => b.classList.toggle('active', b === btn));
    dealerIndex = -1;
    render();
  });
  el('startBtn').addEventListener('click', startHand);
  el('foldBtn').addEventListener('click', humanFold);
  el('callBtn').addEventListener('click', humanCallOrCheck);
  el('raiseBtn').addEventListener('click', humanBetOrRaise);
  el('raiseSlider').addEventListener('input', updateRaiseDisplay);
  render();
});

function isHandActive() { return ['preflop','flop','turn','river'].includes(street) && !handDone; }
function clearAuto() { clearTimeout(autoTimer); autoTimer = null; }
function schedule(fn, delay = 650) { clearAuto(); autoTimer = setTimeout(fn, delay); }
function addLog(text) { logLines.unshift(text); logLines = logLines.slice(0, 14); }
function human() { return players[0]; }
function activePlayers() { return players.filter(p => !p.folded); }
function actors() { return players.filter(p => !p.folded && !p.allIn); }
function makePlayer(name, humanPlayer = false, botSeat = -1) {
  return { name, human: humanPlayer, botSeat, cards: [], folded: false, allIn: false, bet: 0, contributed: 0, acted: false, botStack: botSeat >= 0 ? botStacks[botSeat] : 0, lastAction: '', winner: false, role: '' };
}
function playerStack(p) { return p.human ? getCash() : p.botStack; }
function startHand() {
  if (isHandActive()) return;
  bigBlind = Math.max(2, Math.floor(getBlind()));
  smallBlind = Math.max(1, Math.floor(bigBlind / 2));
  if (getCash() < bigBlind) return toast('Nicht genug Guthaben für den Big Blind.', 'bad');

  clearAuto();
  handDone = false;
  street = 'preflop';
  handNumber++;
  deck = makeDeck(1);
  boardCards = [];
  pot = 0;
  currentBet = 0;
  logLines = [];

  for (let i = 0; i < botCount; i++) if (botStacks[i] < bigBlind) botStacks[i] = 1000;

  players = [makePlayer('Du', true), ...Array.from({ length: botCount }, (_, i) => makePlayer(`Bot ${i + 1}`, false, i))];
  players.forEach(p => {
    p.cards = [deck.pop(), deck.pop()];
    p.folded = false; p.allIn = false; p.bet = 0; p.contributed = 0; p.acted = false; p.lastAction = ''; p.winner = false; p.role = '';
  });

  dealerIndex = (dealerIndex + 1) % players.length;
  assignRolesAndBlinds();
  addLog(`Hand ${handNumber}: Button bei ${players[dealerIndex].name}.`);
  el('msg').textContent = 'Preflop läuft.';
  render();
  schedule(() => proceedToNextActor(true), 450);
}
function assignRolesAndBlinds() {
  const n = players.length;
  const sbIndex = n === 2 ? dealerIndex : nextSeat(dealerIndex);
  const bbIndex = nextSeat(sbIndex);
  players[dealerIndex].role = 'BTN';
  players[sbIndex].role = players[sbIndex].role ? players[sbIndex].role + ' / SB' : 'SB';
  players[bbIndex].role = 'BB';
  postBlind(players[sbIndex], smallBlind, 'Small Blind');
  postBlind(players[bbIndex], bigBlind, 'Big Blind');
  currentBet = Math.max(players[sbIndex].bet, players[bbIndex].bet);
  players.forEach(p => p.acted = false);
  activeIndex = nextActionSeat(bbIndex);
}
function postBlind(player, amount, label) {
  const paid = pay(player, amount);
  player.bet += paid;
  player.contributed += paid;
  pot += paid;
  if (paid < amount) player.allIn = true;
  player.lastAction = `${label} ${money(paid)}`;
  addLog(`${player.name} zahlt ${label} ${money(paid)}.`);
}
function nextSeat(from) { return (from + 1) % players.length; }
function nextActionSeat(from) {
  for (let i = 1; i <= players.length; i++) {
    const idx = (from + i) % players.length;
    const p = players[idx];
    if (!p.folded && !p.allIn) return idx;
  }
  return -1;
}
function pay(player, amount) {
  amount = Math.max(0, Math.floor(amount));
  if (player.human) {
    const paid = Math.min(amount, getCash());
    if (paid > 0) changeCash(-paid);
    return paid;
  }
  const paid = Math.min(amount, player.botStack);
  player.botStack -= paid;
  if (player.botSeat >= 0) botStacks[player.botSeat] = player.botStack;
  return paid;
}
function toCall(player) { return Math.max(0, currentBet - player.bet); }
function maxHumanRaise() { return players.length ? Math.max(0, playerStack(human()) - toCall(human())) : Math.max(1, getCash()); }
function updateRaiseDisplay() {
  const slider = el('raiseSlider');
  slider.max = String(Math.max(1, maxHumanRaise()));
  slider.min = '1';
  if (Number(slider.value) > Number(slider.max)) slider.value = slider.max;
  if (Number(slider.value) < 1) slider.value = '1';
  el('raiseDisplay').textContent = money(slider.value);
}
function bettingRoundComplete() {
  if (activePlayers().length <= 1) return true;
  const liveActors = actors();
  if (liveActors.length === 0) return true;
  return liveActors.every(p => p.acted && p.bet === currentBet);
}
function markRaiseBy(raiser) {
  players.forEach(p => {
    if (p !== raiser && !p.folded && !p.allIn) p.acted = false;
  });
  raiser.acted = true;
}
function humanFold() {
  if (!isHumanTurn()) return;
  clearAuto();
  const h = human();
  h.folded = true;
  h.acted = true;
  h.lastAction = 'Fold';
  addLog('Du foldest.');
  resolveHumanFold();
}
function resolveHumanFold() {
  clearAuto();
  const remaining = activePlayers();
  handDone = true;
  street = 'showdown';
  activeIndex = -1;

  if (remaining.length > 1) {
    revealRemainingBoard();
    let best = null;
    let winners = [];
    remaining.forEach(p => {
      p.rank = bestOfSeven([...p.cards, ...boardCards]);
      const comp = best ? cmp(p.rank, best) : 1;
      if (comp > 0) { best = p.rank; winners = [p]; }
      else if (comp === 0) winners.push(p);
    });
    const share = Math.floor(pot / winners.length);
    winners.forEach(w => {
      w.winner = true;
      if (!w.human) {
        w.botStack += share;
        if (w.botSeat >= 0) botStacks[w.botSeat] = w.botStack;
      }
    });
    const names = winners.map(w => w.name).join(', ');
    el('msg').textContent = `Du foldest. ${names} gewinnt den Pot.`;
    addLog(`Fold: ${names} gewinnt ${money(pot)}.`);
  } else if (remaining.length === 1) {
    const winner = remaining[0];
    winner.winner = true;
    if (!winner.human) {
      winner.botStack += pot;
      if (winner.botSeat >= 0) botStacks[winner.botSeat] = winner.botStack;
    }
    el('msg').textContent = `Du foldest. ${winner.name} gewinnt ${money(pot)}.`;
    addLog(`Fold: ${winner.name} gewinnt ${money(pot)}.`);
  } else {
    el('msg').textContent = 'Du foldest. Hand beendet.';
  }

  recordGame('Texas Holdem', -human().contributed);
  render();
}
function humanCallOrCheck() {
  if (!isHumanTurn()) return;
  clearAuto();
  const h = human();
  const call = toCall(h);
  if (call > 0) {
    const paid = pay(h, call);
    h.bet += paid; h.contributed += paid; pot += paid; h.acted = true;
    if (paid < call || playerStack(h) <= 0) h.allIn = true;
    h.lastAction = paid < call ? `All-in ${money(paid)}` : `Call ${money(paid)}`;
    addLog(paid < call ? `Du gehst all-in mit ${money(paid)}.` : `Du callst ${money(paid)}.`);
  } else {
    h.acted = true;
    h.lastAction = 'Check';
    addLog('Du checkst.');
  }
  afterAction();
}
function humanBetOrRaise() {
  if (!isHumanTurn()) return;
  clearAuto();
  const h = human();
  const call = toCall(h);
  const raise = Math.max(1, Math.floor(Number(el('raiseSlider').value) || 1));
  if (call + raise > playerStack(h)) return toast('Nicht genug Guthaben für diesen Einsatz.', 'bad');
  const paid = pay(h, call + raise);
  h.bet += paid; h.contributed += paid; pot += paid;
  if (playerStack(h) <= 0) h.allIn = true;
  currentBet = Math.max(currentBet, h.bet);
  h.lastAction = call > 0 ? `Raise auf ${money(currentBet)}` : `Bet ${money(currentBet)}`;
  addLog(`Du ${call > 0 ? 'raist auf' : 'bettest'} ${money(currentBet)}.`);
  markRaiseBy(h);
  afterAction();
}
function isHumanTurn() { return isHandActive() && activeIndex === 0 && !human().folded && !human().allIn; }
function proceedToNextActor(fromCurrent = false) {
  if (!isHandActive()) return;
  if (finishIfOnlyOneLeft()) return;
  if (bettingRoundComplete()) {
    schedule(advanceStreet, 650);
    render();
    return;
  }
  if (!fromCurrent) activeIndex = nextActionSeat(activeIndex);
  if (activeIndex < 0) {
    schedule(advanceStreet, 650);
    render();
    return;
  }
  const p = players[activeIndex];
  render();
  if (p.human) {
    const call = toCall(p);
    el('msg').textContent = call > 0 ? `Du bist dran: ${money(call)} callen, raisen oder folden.` : 'Du bist dran: checken oder betten.';
    return;
  }
  schedule(() => botAct(p), 650);
}
function afterAction() {
  if (finishIfOnlyOneLeft()) return;
  activeIndex = nextActionSeat(activeIndex);
  proceedToNextActor(true);
}
function botAct(bot) {
  if (!isHandActive() || bot.folded || bot.allIn) return proceedToNextActor();
  const call = toCall(bot);
  const strength = estimateStrength(bot);
  if (call > 0) {
    const pressure = call / Math.max(1, bigBlind);
    const foldChance = Math.max(0.03, Math.min(0.72, 0.52 - strength * 0.36 + pressure * 0.1));
    const raiseChance = Math.max(0.02, Math.min(0.3, strength * 0.2 - pressure * 0.025));
    const roll = Math.random();
    if (roll < foldChance && activePlayers().length > 2) {
      bot.folded = true;
      bot.acted = true;
      bot.lastAction = 'Fold';
      addLog(`${bot.name} foldet.`);
    } else {
      const doRaise = roll > 1 - raiseChance && playerStack(bot) > call + bigBlind;
      const extra = doRaise ? Math.min(playerStack(bot) - call, bigBlind * (1 + Math.floor(Math.random() * 3))) : 0;
      const paid = pay(bot, call + extra);
      bot.bet += paid; bot.contributed += paid; pot += paid;
      if (playerStack(bot) <= 0 || paid < call + extra) bot.allIn = true;
      if (extra > 0) {
        currentBet = Math.max(currentBet, bot.bet);
        bot.lastAction = `Raise auf ${money(currentBet)}`;
        addLog(`${bot.name} raist auf ${money(currentBet)}.`);
        markRaiseBy(bot);
      } else {
        bot.acted = true;
        bot.lastAction = paid < call ? `All-in ${money(paid)}` : `Call ${money(paid)}`;
        addLog(paid < call ? `${bot.name} geht all-in.` : `${bot.name} callt.`);
      }
    }
  } else {
    const betChance = Math.max(0.05, Math.min(0.34, strength * 0.22));
    if (Math.random() < betChance && playerStack(bot) > bigBlind) {
      const amount = Math.min(playerStack(bot), bigBlind * (1 + Math.floor(Math.random() * 2)));
      const paid = pay(bot, amount);
      bot.bet += paid; bot.contributed += paid; pot += paid;
      if (playerStack(bot) <= 0) bot.allIn = true;
      currentBet = Math.max(currentBet, bot.bet);
      bot.lastAction = `Bet ${money(currentBet)}`;
      addLog(`${bot.name} bettet ${money(currentBet)}.`);
      markRaiseBy(bot);
    } else {
      bot.acted = true;
      bot.lastAction = 'Check';
      addLog(`${bot.name} checkt.`);
    }
  }
  afterAction();
}
function resetStreetBets() {
  players.forEach(p => { p.bet = 0; p.acted = false; if (!p.folded) p.lastAction = p.allIn ? 'All-in' : ''; });
  currentBet = 0;
}
function burn() { deck.pop(); }
function advanceStreet() {
  if (!isHandActive()) return;
  clearAuto();
  if (finishIfOnlyOneLeft()) return;
  resetStreetBets();
  if (street === 'preflop') {
    burn(); boardCards.push(deck.pop(), deck.pop(), deck.pop()); street = 'flop'; addLog('Flop wird aufgedeckt.');
  } else if (street === 'flop') {
    burn(); boardCards.push(deck.pop()); street = 'turn'; addLog('Turn wird aufgedeckt.');
  } else if (street === 'turn') {
    burn(); boardCards.push(deck.pop()); street = 'river'; addLog('River wird aufgedeckt.');
  } else if (street === 'river') {
    showdown(); return;
  }
  const liveActors = actors();
  if (liveActors.length <= 1) {
    schedule(advanceStreet, 700);
    render();
    return;
  }
  activeIndex = nextActionSeat(dealerIndex);
  el('msg').textContent = `${STREET_LABELS[street]}: Setzrunde läuft.`;
  render();
  schedule(() => proceedToNextActor(true), 550);
}
function revealRemainingBoard() {
  while (boardCards.length < 5) {
    burn();
    boardCards.push(deck.pop());
  }
}
function finishIfOnlyOneLeft() {
  const alive = activePlayers();
  if (alive.length !== 1) return false;
  clearAuto();
  const winner = alive[0];
  winner.winner = true;
  handDone = true;
  street = 'showdown';
  if (winner.human) {
    changeCash(pot);
    recordGame('Texas Holdem', pot - human().contributed);
    el('msg').textContent = `Alle Gegner folden. Du gewinnst ${money(pot)}.`;
  } else {
    recordGame('Texas Holdem', -human().contributed);
    el('msg').textContent = `${winner.name} gewinnt den Pot.`;
  }
  addLog(`${winner.name} gewinnt ${money(pot)}.`);
  render();
  return true;
}
function showdown() {
  if (handDone) return;
  clearAuto();
  revealRemainingBoard();
  const alive = activePlayers();
  let best = null;
  let winners = [];
  alive.forEach(p => {
    p.rank = bestOfSeven([...p.cards, ...boardCards]);
    const comp = best ? cmp(p.rank, best) : 1;
    if (comp > 0) { best = p.rank; winners = [p]; }
    else if (comp === 0) winners.push(p);
  });
  winners.forEach(p => { p.winner = true; });
  const share = Math.floor(pot / winners.length);
  let profit = -human().contributed;
  if (winners.includes(human())) {
    changeCash(share);
    profit = share - human().contributed;
    el('msg').textContent = winners.length > 1
      ? `Split Pot: Dein Anteil ${money(share)} mit ${rankName(human().rank)}.`
      : `Du gewinnst ${money(share)} mit ${rankName(human().rank)} 🎉`;
  } else {
    el('msg').textContent = `${winners.map(w => w.name).join(', ')} gewinnt mit ${rankName(best)}. Deine Hand: ${rankName(human().rank)}.`;
  }
  recordGame('Texas Holdem', profit);
  handDone = true;
  street = 'showdown';
  addLog(`Showdown: ${winners.map(w => w.name).join(', ')} gewinnt.`);
  render();
}
function estimateStrength(player) {
  if (boardCards.length >= 3) {
    const rank = bestOfSeven([...player.cards, ...boardCards]);
    return Math.min(1, (rank.cat + 1) / 9 + Math.random() * 0.16);
  }
  const vals = player.cards.map(c => c.value === 1 ? 14 : c.value).sort((a,b)=>b-a);
  let s = (vals[0] + vals[1]) / 28;
  if (vals[0] === vals[1]) s += 0.35;
  if (player.cards[0].suit === player.cards[1].suit) s += 0.08;
  if (Math.abs(vals[0] - vals[1]) <= 2) s += 0.06;
  return Math.max(0, Math.min(1, s));
}
function render() {
  if (el('potOut')) el('potOut').textContent = money(pot);
  if (el('streetOut')) el('streetOut').textContent = STREET_LABELS[street] || street;
  if (el('currentBetOut')) el('currentBetOut').textContent = money(currentBet);
  if (el('toCallOut')) el('toCallOut').textContent = players.length && isHandActive() ? money(toCall(human())) : '0 €';
  el('board').innerHTML = boardCards.map(c => cardHTML(c)).join('') + Array.from({ length: Math.max(0, 5 - boardCards.length) }, () => cardHTML(null, true)).join('');
  el('seats').innerHTML = players.length ? players.map((p, i) => seatHTML(p, i)).join('') : emptySeatsHTML();
  const humanTurn = isHumanTurn();
  const call = players.length ? toCall(human()) : 0;
  el('startBtn').disabled = isHandActive();
  el('startBtn').textContent = handDone ? 'Nächste Hand' : 'Neue Hand';
  el('foldBtn').disabled = !humanTurn;
  el('callBtn').disabled = !humanTurn || call > getCash();
  el('callBtn').textContent = call > 0 ? `Call ${money(call)}` : 'Check';
  el('raiseBtn').disabled = !humanTurn || maxHumanRaise() <= 0;
  el('raiseBtn').textContent = call > 0 ? 'Raise' : 'Bet';
  document.querySelectorAll('#botBtns button, #blindPresets button').forEach(x => { x.disabled = isHandActive(); });
  updateRaiseDisplay();
  el('log').innerHTML = logLines.length ? logLines.map(line => `<div>${line}</div>`).join('') : '<span class="mini">Noch keine Aktionen.</span>';
  syncUI();
}
function emptySeatsHTML() {
  return `<div class="seat you"><span class="role-badge">DU</span><h3>Du</h3><div class="hand-zone">${cardHTML(null,true)}${cardHTML(null,true)}</div><div class="seat-meta"><span class="score-badge">bereit</span></div></div>` +
    Array.from({ length: botCount }, (_, i) => `<div class="seat"><h3>Bot ${i + 1}</h3><div class="hand-zone">${cardHTML(null,true)}${cardHTML(null,true)}</div><div class="seat-meta"><span class="score-badge">Stack ${money(botStacks[i] || 1000)}</span></div></div>`).join('');
}
function seatHTML(p, index) {
  const showCards = p.human || street === 'showdown' || handDone;
  const cards = p.cards.map(c => cardHTML(c, !showCards)).join('');
  const rank = street === 'showdown' && !p.folded ? rankName(p.rank || bestOfSeven([...p.cards, ...boardCards])) : (p.lastAction || 'wartet');
  const cls = ['seat'];
  if (p.human) cls.push('you');
  if (p.folded) cls.push('folded');
  if (p.winner) cls.push('winner');
  if (index === activeIndex && isHandActive()) cls.push('active-turn');
  return `<div class="${cls.join(' ')}">${p.role ? `<span class="role-badge">${p.role}</span>` : ''}<h3>${p.name}</h3><div class="hand-zone">${cards}</div><div class="seat-meta"><span class="score-badge">Stack ${money(playerStack(p))}</span><span class="score-badge">Im Pot ${money(p.contributed)}</span><span class="score-badge">${rank}</span></div></div>`;
}
function cardVals(hand) { return hand.map(c => c.value === 1 ? 14 : c.value).sort((a, b) => b - a); }
function evalFive(hand) {
  const v = cardVals(hand);
  const counts = {};
  v.forEach(x => { counts[x] = (counts[x] || 0) + 1; });
  const groups = Object.entries(counts).map(([val, count]) => ({ val: Number(val), count })).sort((a, b) => b.count - a.count || b.val - a.val);
  const flush = hand.every(c => c.suit === hand[0].suit);
  let straight = false;
  let straightHigh = v[0];
  const uniq = [...new Set(v)];
  if (uniq.length === 5 && uniq.every((x, i) => i === 0 || uniq[i - 1] - 1 === x)) { straight = true; straightHigh = uniq[0]; }
  if (JSON.stringify(uniq) === '[14,5,4,3,2]') { straight = true; straightHigh = 5; }
  if (straight && flush) return { cat: 8, tie: [straightHigh] };
  if (groups[0].count === 4) return { cat: 7, tie: [groups[0].val, groups[1].val] };
  if (groups[0].count === 3 && groups[1] && groups[1].count === 2) return { cat: 6, tie: [groups[0].val, groups[1].val] };
  if (flush) return { cat: 5, tie: v };
  if (straight) return { cat: 4, tie: [straightHigh] };
  if (groups[0].count === 3) return { cat: 3, tie: [groups[0].val, ...groups.slice(1).map(g => g.val).sort((a,b)=>b-a)] };
  if (groups[0].count === 2 && groups[1] && groups[1].count === 2) return { cat: 2, tie: [Math.max(groups[0].val, groups[1].val), Math.min(groups[0].val, groups[1].val), groups[2].val] };
  if (groups[0].count === 2) return { cat: 1, tie: [groups[0].val, ...groups.slice(1).map(g => g.val).sort((a,b)=>b-a)] };
  return { cat: 0, tie: v };
}
function cmp(a, b) {
  if (a.cat !== b.cat) return a.cat - b.cat;
  for (let i = 0; i < Math.max(a.tie.length, b.tie.length); i++) {
    if ((a.tie[i] || 0) !== (b.tie[i] || 0)) return (a.tie[i] || 0) - (b.tie[i] || 0);
  }
  return 0;
}
function bestOfSeven(cards) {
  let best = null;
  for (let a = 0; a < cards.length - 4; a++) for (let b = a + 1; b < cards.length - 3; b++) for (let c = b + 1; c < cards.length - 2; c++) for (let d = c + 1; d < cards.length - 1; d++) for (let e = d + 1; e < cards.length; e++) {
    const rank = evalFive([cards[a], cards[b], cards[c], cards[d], cards[e]]);
    if (!best || cmp(rank, best) > 0) best = rank;
  }
  return best || { cat: 0, tie: [] };
}
function rankName(r) {
  return ['High Card','Ein Paar','Zwei Paare','Drilling','Straight','Flush','Full House','Vierling','Straight Flush'][r.cat] || 'Hand';
}
