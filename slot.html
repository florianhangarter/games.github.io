<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tomb of Fortune Slots</title>
<link rel="stylesheet" href="styles.css">
<script src="casino-utils.js"></script>
<style>
  body{background:radial-gradient(circle at 50% 8%,#8ccfc6 0%,#285e63 28%,#16363f 52%,#0a171c 100%)}
  .slot-shell{max-width:920px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(145deg,#1f2f33,#0d171a);border-color:#d8b15f;box-shadow:0 25px 60px rgba(0,0,0,.72),0 0 35px rgba(216,177,95,.16)}
  .slot-shell:before{content:"ANCIENT TREASURE";position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:4px;color:#f3ddb0;opacity:.72;font-weight:900}
  .slot-title{margin-top:18px;background:linear-gradient(#f6e3b0,#d8b15f,#8c6320);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
  .slot-sub{color:rgba(230,217,180,.72);text-align:center;letter-spacing:3px;text-transform:uppercase;margin-top:-2px;font-size:12px}
  .slot-board{position:relative;margin:18px auto 10px;max-width:720px;background:linear-gradient(180deg,#0a1214,#12262c 58%,#081012 100%);border:3px solid #9d7a34;border-radius:20px;padding:18px;box-shadow:inset 0 0 30px rgba(0,0,0,.82),0 0 18px rgba(216,177,95,.10);min-height:352px;display:flex;align-items:center;justify-content:center}
  .reels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative;z-index:2;width:100%}
  .slot-board.risk-mode .reels{display:none}
  .reel{display:grid;grid-template-rows:repeat(3,96px);gap:10px;background:linear-gradient(#173038,#0c1a1f);padding:8px;border-radius:14px;border:1px solid rgba(174,216,206,.12);box-shadow:inset 0 0 18px rgba(0,0,0,.7)}
  .slot-cell{display:flex;align-items:center;justify-content:center;font-size:48px;border-radius:12px;background:radial-gradient(circle at 50% 25%,#4f665f,#263936 72%);border:1px solid rgba(216,177,95,.14);box-shadow:inset 0 2px 10px rgba(255,255,255,.05),inset 0 -8px 12px rgba(0,0,0,.35);transition:transform .12s,filter .12s,background .12s,border-color .12s;color:#f2e4bd}
  .slot-cell.spin{filter:blur(3px) brightness(1.3);transform:scaleY(1.06)}
  .slot-cell.win{background:radial-gradient(circle,#8b6a24,#3d2c0d 72%);border-color:#f0cc77;animation:goldPulse .48s infinite alternate}
  .slot-cell.scatter{border-color:#8be4e2;background:radial-gradient(circle,#3b7f86,#173238 72%)}
  .slot-cell.expand{background:radial-gradient(circle,#8c4e21,#351809 72%);border-color:#f59a52;animation:expandPulse .45s infinite alternate}
  @keyframes goldPulse{from{box-shadow:0 0 6px rgba(240,204,119,.35)}to{box-shadow:0 0 20px rgba(240,204,119,.88)}}
  @keyframes expandPulse{from{transform:scale(.98);box-shadow:0 0 8px rgba(245,154,82,.35)}to{transform:scale(1.04);box-shadow:0 0 24px rgba(245,154,82,.9)}}
  .status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px auto;max-width:720px}
  .status-grid .counter-display{text-align:center;border-radius:16px}
  .paytable{max-width:720px;margin:14px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;font-size:12px;color:rgba(236,231,212,.76)}
  .payitem{background:rgba(8,16,18,.34);border:1px solid rgba(216,177,95,.14);border-radius:12px;padding:8px;text-align:center}
  .payitem b{color:#f0cc77;font-size:18px;display:block}
  .fs-banner{display:none;max-width:720px;margin:12px auto;padding:12px;border-radius:16px;background:linear-gradient(90deg,rgba(18,63,66,.82),rgba(120,88,24,.58));border:1px solid rgba(240,204,119,.42);text-align:center;font-weight:900;color:#f6e4b2}
  .fs-banner.on{display:block}
  .history{display:flex;gap:8px;overflow:hidden;justify-content:center;max-width:720px;margin:10px auto}
  .history span{padding:5px 9px;background:rgba(0,0,0,.28);border-radius:999px;font-size:12px;color:#f0cc77;border:1px solid rgba(240,204,119,.18)}
  .risk-ladder{display:none;width:100%;height:100%;padding:0;border-radius:18px;background:transparent;border:none;box-shadow:none}
  .slot-board.risk-mode .risk-ladder.on{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
  .ladder-rail{position:relative;padding:6px 0;max-width:190px;margin:0 auto}
  .ladder-rail:before{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:5px;transform:translateX(-50%);border-radius:999px;background:linear-gradient(180deg,#b99343,#4c3610);box-shadow:0 0 12px rgba(240,204,119,.18)}
  .ladder-title{text-align:center;text-transform:uppercase;letter-spacing:3px;color:#f3ddb0;font-weight:950;font-size:13px;margin-bottom:8px}
  .ladder-steps{display:grid;grid-template-columns:1fr;gap:7px;position:relative;z-index:1}
  .ladder-step{position:relative;text-align:center;padding:8px 8px;border-radius:13px;background:linear-gradient(180deg,rgba(21,43,47,.96),rgba(10,21,24,.96));border:1px solid rgba(216,177,95,.16);box-shadow:inset 0 0 12px rgba(255,255,255,.02);color:rgba(232,219,186,.60);font-size:11px;font-weight:900;min-height:48px}
  .ladder-step span{display:block;letter-spacing:1px}
  .ladder-step b{display:block;color:#ebc66d;font-size:15px;margin-top:2px}
  .ladder-step.current{background:linear-gradient(180deg,#8a6424,#3a260a);border-color:#f0cc77;color:#fff4cc;box-shadow:0 0 18px rgba(240,204,119,.42), inset 0 0 10px rgba(255,255,255,.06)}
  .ladder-step.option-up{border-color:rgba(135,232,211,.44)}
  .ladder-step.option-down{border-color:rgba(255,170,122,.42)}
  .ladder-step.blink-up{border-color:#8be4e2;box-shadow:0 0 20px rgba(139,228,226,.42)}
  .ladder-step.blink-up b{animation:ladderBlink .36s infinite alternate;color:#d6ffff}
  .ladder-step.blink-down{border-color:#ffae7a;box-shadow:0 0 20px rgba(255,174,122,.42)}
  .ladder-step.blink-down b{animation:ladderBlink .36s infinite alternate;color:#ffe4d3}
  @keyframes ladderBlink{from{opacity:.55;transform:scale(1)}to{opacity:1;transform:scale(1.06);text-shadow:0 0 10px rgba(255,235,150,.65)}}
  .ladder-side{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100%;height:100%;padding-top:6px}
  .ladder-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:48px}
  .ladder-actions button{min-width:150px;width:150px;flex:0 0 150px}
  .risk-ready{animation:riskGlow .75s infinite alternate;border-color:#f0cc77!important;box-shadow:0 0 16px rgba(240,204,119,.35)!important}
  @keyframes riskGlow{from{filter:brightness(1)}to{filter:brightness(1.18)}}
  @media(max-width:760px){.slot-board.risk-mode .risk-ladder.on{grid-template-columns:1fr;gap:14px}.ladder-rail{max-width:180px;margin:0 auto}.ladder-actions{justify-content:center}}
  @media(max-width:680px){.reel{grid-template-rows:repeat(3,68px);gap:7px;padding:6px}.slot-cell{font-size:34px}.slot-board{padding:10px;min-height:300px}.reels{gap:7px}.slot-title{font-size:34px}.ladder-step{min-height:42px;padding:7px 7px}}
  @media(max-height:820px){
    .slot-machine{padding:16px;max-width:560px}
    .reels-container{padding:12px;gap:8px}
    .reel-column{gap:6px}
    .slot-cell{height:clamp(46px,12vh,72px);font-size:clamp(26px,5vw,38px)}
    #slots-message{font-size:18px;margin:10px 0}
    .paylines-info{margin-top:10px}
  }
  @media(max-width:680px){
    .slot-machine{padding:14px}
    .reels-container{gap:6px;padding:10px}
    .slot-cell{height:64px;font-size:30px}
  }
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <button class="danger" onclick="goLobby()">🏰 Lobby</button>
    <div class="counter-display">Bank: <span class="shared-bankroll">1000 €</span></div>
    <div class="counter-display">Einsatz: <span id="betOut">10 €</span></div>
    <div class="counter-display">Freispiele: <span id="fsOut">0</span></div>
    <div class="counter-display">FS Gewinn: <span id="fsTotalOut">0 €</span></div>
    <div class="counter-display">Letzter Gewinn: <span id="lastWinOut">0 €</span></div>
  </div>

  <section class="panel slot-shell">
    <h1 class="title slot-title">🏺 Tomb of Fortune 🏺</h1>

    <div class="betbox">
      <label for="betSlider">Gesamteinsatz pro Spin</label>
      <b id="betDisplay">10 €</b>
      <input id="betSlider" type="range">
    </div>

    <div class="status-grid">
      <div class="counter-display">Linien: <span>9 aktiv</span></div>
      <div class="counter-display">Linieneinsatz: <span id="lineBetOut">1.11 €</span></div>
      <div class="counter-display">Bonus-Symbol: <span id="bonusOut">–</span></div>
    </div>

    <div id="fsBanner" class="fs-banner">🔥 Freispiele bereit — drücke Spin, um jedes Freispiel selbst zu starten!</div>

    <div class="slot-board" id="slotBoard">
      <div class="reels" id="reels"></div>
      <div class="risk-ladder" id="riskLadder">
        <div class="ladder-rail">
          <div class="ladder-title" id="ladderTitle">Risikoleiter</div>
          <div class="ladder-steps" id="ladderSteps"></div>
        </div>
        <div class="ladder-side">
          <div class="ladder-actions">
            <button id="ladderPanelBtn" onclick="ladderUp()">Drücken</button>
          </div>
        </div>
      </div>
    </div>

    <div id="msg" class="message"></div>

    <div class="controls">
      <button class="primary" id="spinBtn" onclick="spin()">Spin</button>
      <button id="autoBtn" onclick="toggleAuto()">Auto</button>
      <button id="ladderBtn" onclick="openRiskLadder()" disabled>Leiter</button>
      <button onclick="showPaytable()">Gewinntabelle</button>
    </div>

    <div class="history" id="history"></div>
    <div class="paytable" id="paytable" style="display:none"></div>
  </section>
</main>

<script>
const ROWS = 3, REELS = 5;
const PAYLINES = [
  [[1,0],[1,1],[1,2],[1,3],[1,4]],
  [[0,0],[0,1],[0,2],[0,3],[0,4]],
  [[2,0],[2,1],[2,2],[2,3],[2,4]],
  [[0,0],[1,1],[2,2],[1,3],[0,4]],
  [[2,0],[1,1],[0,2],[1,3],[2,4]],
  [[0,0],[0,1],[1,2],[2,3],[2,4]],
  [[2,0],[2,1],[1,2],[0,3],[0,4]],
  [[1,0],[0,1],[0,2],[0,3],[1,4]],
  [[1,0],[2,1],[2,2],[2,3],[1,4]]
];
const SYMBOLS = [
  { icon:'🏺', name:'Urne', weight:11, pay:{3:5,4:20,5:80} },
  { icon:'🦂', name:'Skorpion', weight:10, pay:{3:6,4:25,5:100} },
  { icon:'🐈', name:'Tempelkatze', weight:9, pay:{3:8,4:35,5:140} },
  { icon:'🪙', name:'Goldmünze', weight:8, pay:{3:10,4:45,5:180} },
  { icon:'🔱', name:'Relikt', weight:6, pay:{3:14,4:70,5:260} },
  { icon:'👑', name:'Krone', weight:4, pay:{3:20,4:100,5:400} },
  { icon:'💎', name:'Edelstein', weight:3, pay:{2:5,3:30,4:160,5:650} },
  { icon:'📖', name:'Journal', weight:3, scatter:true, pay:{3:2,4:20,5:200} }
];
const NORMAL_SYMBOLS = SYMBOLS.filter(s => !s.scatter);
const POOL = [];
SYMBOLS.forEach(s => { for (let i = 0; i < s.weight; i++) POOL.push(s); });

let getBet, spinning = false, auto = false, autoTimer = null;
const ALL_LADDER_STEPS = [2,4,6,8,10,15,20,30,40,50,60,80,100,120,140,160,200,250,300];
const LOSS_STEP = 'LOSS';
let freeSpins = 0, totalFsWin = 0, bonusSymbol = null, currentMatrix = [];
let lastWin = 0, ladderLevel = -1, riskOpen = false, riskScale = 1, blinkTimer = null, blinkTarget = 'up';

const el = id => document.getElementById(id);

document.addEventListener('DOMContentLoaded', () => {
  getBet = createBetSlider({ inputId:'betSlider', displayId:'betDisplay', min:1, max:500, value:10, onChange:updateBetUI });
  updateBetUI(getBet());
  buildPaytable();
  currentMatrix = randomMatrix();
  draw(currentMatrix);
  syncLadder();
});

function updateBetUI(v) {
  el('betOut').textContent = money(v);
  el('lineBetOut').textContent = (v / PAYLINES.length).toFixed(2) + ' €';
}
function randSym() { return POOL[Math.floor(Math.random() * POOL.length)]; }
function randomMatrix() { return Array.from({ length: ROWS }, () => Array.from({ length: REELS }, randSym)); }
function symbolByIcon(icon) { return SYMBOLS.find(s => s.icon === icon); }
function draw(matrix, highlights = [], expandCells = []) {
  const hi = new Set(highlights.map(([r,c]) => `${r}-${c}`));
  const ex = new Set(expandCells.map(([r,c]) => `${r}-${c}`));
  el('reels').innerHTML = '';
  for (let c = 0; c < REELS; c++) {
    const reel = document.createElement('div');
    reel.className = 'reel';
    for (let r = 0; r < ROWS; r++) {
      const s = matrix[r][c];
      const cell = document.createElement('div');
      cell.className = 'slot-cell' + (hi.has(`${r}-${c}`) ? ' win' : '') + (s.scatter ? ' scatter' : '') + (ex.has(`${r}-${c}`) ? ' expand' : '');
      cell.textContent = s.icon;
      reel.appendChild(cell);
    }
    el('reels').appendChild(reel);
  }
}
function setSpinBlur(on) { document.querySelectorAll('.slot-cell').forEach(c => c.classList.toggle('spin', on)); }

function spin() {
  if (spinning) return;
  const bet = getBet();
  const isFree = freeSpins > 0;
  if (!isFree && !canAfford(bet)) { auto = false; syncAutoButton(); return toast('Nicht genug Guthaben.'); }
  if (isFree) { freeSpins--; el('fsOut').textContent = freeSpins; }
  else { changeCash(-bet); totalFsWin = 0; el('fsTotalOut').textContent = money(0); bonusSymbol = null; el('bonusOut').textContent = '–'; clearRisk(false); }

  spinning = true;
  el('spinBtn').disabled = true;
  el('msg').textContent = isFree ? 'Freispiel dreht...' : 'Die Expedition beginnt...';

  let ticks = 0;
  const timer = setInterval(() => {
    currentMatrix = randomMatrix();
    draw(currentMatrix);
    setSpinBlur(true);
    if (++ticks >= 14) {
      clearInterval(timer);
      setSpinBlur(false);
      finishSpin(currentMatrix, isFree, bet);
    }
  }, 65);
}

function finishSpin(matrix, isFree, bet) {
  if (isFree && !bonusSymbol) {
    bonusSymbol = NORMAL_SYMBOLS[Math.floor(Math.random() * NORMAL_SYMBOLS.length)];
    el('bonusOut').textContent = bonusSymbol.icon + ' ' + bonusSymbol.name;
  }

  let expandedCells = [];
  if (isFree && bonusSymbol) {
    for (let c = 0; c < REELS; c++) {
      let hasBonus = false;
      for (let r = 0; r < ROWS; r++) if (matrix[r][c].icon === bonusSymbol.icon) hasBonus = true;
      if (hasBonus) for (let r = 0; r < ROWS; r++) { matrix[r][c] = bonusSymbol; expandedCells.push([r,c]); }
    }
  }

  const result = evaluate(matrix, bet);
  const freeReelResult = isFree ? evaluateFreeSpinReelHits(matrix, bet) : { win: 0, cells: [] };
  const scatterResult = evaluateScatters(matrix, bet);
  let win = result.win + freeReelResult.win + scatterResult.win;
  let highlights = result.cells.concat(freeReelResult.cells, scatterResult.cells);

  if (scatterResult.count >= 3) {
    const awarded = scatterResult.count === 3 ? 10 : scatterResult.count === 4 ? 15 : 20;
    freeSpins += awarded;
    if (!isFree) { auto = false; syncAutoButton(); }
    bonusSymbol = NORMAL_SYMBOLS[Math.floor(Math.random() * NORMAL_SYMBOLS.length)];
    el('bonusOut').textContent = bonusSymbol.icon + ' ' + bonusSymbol.name;
    el('msg').textContent = `📖 ${scatterResult.count} Journale! +${awarded} Freispiele. Bonus: ${bonusSymbol.icon}`;
  } else if (win > 0) {
    const waysText = freeReelResult.win > 0 ? ' · 3+ gleiche Symbole auf verschiedenen Walzen' : '';
    el('msg').textContent = `Gewinn: ${money(win)}${expandedCells.length ? ' · Bonus-Symbol expandiert!' : ''}${waysText}`;
  } else {
    el('msg').textContent = isFree ? 'Freispiel ohne Gewinn.' : 'Kein Fund in dieser Kammer.';
  }

  if (win > 0) changeCash(win);
  if (isFree) totalFsWin += win;
  el('fsTotalOut').textContent = money(totalFsWin);
  if (isFree && freeSpins === 0) el('msg').textContent = `Freispiele beendet · Gesamtgewinn: ${money(totalFsWin)}`;
  el('lastWinOut').textContent = money(win);
  el('fsOut').textContent = freeSpins;
  el('fsBanner').classList.toggle('on', freeSpins > 0);
  if (freeSpins > 0) { el('spinBtn').textContent = auto ? 'Auto läuft' : 'Freispiel starten'; }
  else { if (isFree) { auto = false; syncAutoButton(); } el('spinBtn').textContent = 'Spin'; }
  draw(matrix, highlights, expandedCells);
  if (!isFree && win > 0 && freeSpins === 0) startRisk(win);
  else if (!isFree) clearRisk(false);
  addHistory(win, isFree);
  recordGame('Tomb of Fortune Slots', win - (isFree ? 0 : bet));

  spinning = false;
  el('spinBtn').disabled = false;
  if (auto && canContinue()) autoTimer = setTimeout(spin, 780);
}

function evaluate(matrix, bet) {
  const lineBet = bet / PAYLINES.length;
  let win = 0, cells = [];
  PAYLINES.forEach(line => {
    const first = matrix[line[0][0]][line[0][1]];
    if (first.scatter) return;
    let count = 1;
    for (let i = 1; i < line.length; i++) {
      const s = matrix[line[i][0]][line[i][1]];
      if (s.icon === first.icon) count++; else break;
    }
    const pay = first.pay[count] || 0;
    if (pay > 0) {
      win += Math.floor(lineBet * pay);
      cells.push(...line.slice(0, count));
    }
  });
  return { win, cells };
}
function evaluateFreeSpinReelHits(matrix, bet) {
  // In Freispielen reicht es jetzt, wenn ein normales Symbol auf mindestens 3 verschiedenen Walzen vorkommt.
  // Das ist absichtlich zusaetzlich zur klassischen Linienwertung.
  let win = 0;
  const cells = [];
  for (const sym of NORMAL_SYMBOLS) {
    const reels = new Map();
    for (let c = 0; c < REELS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (matrix[r][c].icon === sym.icon) {
          if (!reels.has(c)) reels.set(c, []);
          reels.get(c).push([r, c]);
        }
      }
    }
    const reelCount = reels.size;
    if (reelCount >= 3) {
      const pay = sym.pay[Math.min(5, reelCount)] || 0;
      if (pay > 0) {
        win += Math.floor((bet / 3) * pay);
        [...reels.values()].forEach(list => cells.push(...list));
      }
    }
  }
  return { win, cells };
}
function evaluateScatters(matrix, bet) {
  const cells = [];
  matrix.forEach((row,r) => row.forEach((s,c) => { if (s.scatter) cells.push([r,c]); }));
  const scatter = SYMBOLS.find(s => s.scatter);
  const pay = scatter.pay[cells.length] || 0;
  return { count: cells.length, win: Math.floor(bet * pay), cells: pay ? cells : [] };
}
function canContinue() { return freeSpins > 0 || canAfford(getBet()); }
function toggleAuto() { auto = !auto; syncAutoButton(); if (auto && !spinning) spin(); else clearTimeout(autoTimer); }
function syncAutoButton() { el('autoBtn').classList.toggle('active', auto); el('autoBtn').textContent = auto ? 'Stop Auto' : 'Auto'; }
function addHistory(win, isFree) {
  const h = el('history');
  const item = document.createElement('span');
  item.textContent = (isFree ? 'FS ' : '') + (win > 0 ? '+' + money(win) : '0 €');
  h.prepend(item);
  while (h.children.length > 10) h.removeChild(h.lastChild);
}

function chooseStartLevel(win) {
  let index = 0;
  for (let i = 0; i < ALL_LADDER_STEPS.length; i++) {
    if (ALL_LADDER_STEPS[i] <= 140 && win >= ALL_LADDER_STEPS[i]) index = i;
  }
  return index;
}
function currentRiskLabel() {
  return ALL_LADDER_STEPS[Math.max(0, ladderLevel)] || ALL_LADDER_STEPS[0];
}
function upRiskLabel() {
  return ALL_LADDER_STEPS[ladderLevel + 1] || null;
}
function downRiskLabel() {
  if (ladderLevel <= 0) return LOSS_STEP;
  return ALL_LADDER_STEPS[ladderLevel - 1] || LOSS_STEP;
}
function scaledRiskWin(label) {
  return Math.max(1, Math.floor(riskScale * label));
}
function startRisk(win) {
  lastWin = win;
  ladderLevel = chooseStartLevel(win);
  riskScale = win / currentRiskLabel();
  riskOpen = false;
  blinkTarget = 'up';
  stopBlink();
  syncLadder();
  el('msg').textContent = `Gewinn: ${money(win)} · Risikoleiter verfügbar.`;
}
function clearRisk(resetMessage = true) {
  lastWin = 0;
  ladderLevel = -1;
  riskOpen = false;
  riskScale = 1;
  blinkTarget = 'up';
  stopBlink();
  syncLadder();
  if (resetMessage) el('msg').textContent = '';
}
function getBlinkInterval() {
  const total = Math.max(1, ALL_LADDER_STEPS.length - 1);
  const progress = ladderLevel <= 0 ? 0 : Math.min(1, ladderLevel / total);
  const base = 280 - Math.floor(progress * 115);
  const jitter = Math.floor(Math.random() * 150) - 55;
  const spike = Math.random() < 0.18 ? (Math.random() < 0.5 ? -45 : 60) : 0;
  return Math.max(95, base + jitter + spike);
}
function queueBlinkTick() {
  if (!riskOpen || lastWin <= 0 || freeSpins > 0) {
    blinkTimer = null;
    return;
  }
  const delay = getBlinkInterval();
  blinkTimer = setTimeout(() => {
    const hasUp = !!upRiskLabel();
    const hasDown = !!downRiskLabel();
    if (hasUp && hasDown) {
      if (Math.random() < 0.82) blinkTarget = blinkTarget === 'up' ? 'down' : 'up';
    } else if (hasUp) blinkTarget = 'up';
    else blinkTarget = 'down';
    syncLadder();
    queueBlinkTick();
  }, delay);
}
function startBlink() {
  if (blinkTimer || !riskOpen || lastWin <= 0 || freeSpins > 0) return;
  queueBlinkTick();
}
function stopBlink() {
  if (blinkTimer) {
    clearTimeout(blinkTimer);
    blinkTimer = null;
  }
}
function openRiskLadder() {
  if (lastWin <= 0 || freeSpins > 0) return;
  riskOpen = !riskOpen;
  if (riskOpen) {
    const hasUp = !!upRiskLabel();
    const hasDown = !!downRiskLabel();
    if (hasUp && hasDown) blinkTarget = Math.random() < 0.5 ? 'up' : 'down';
    else if (hasUp) blinkTarget = 'up';
    else blinkTarget = 'down';
    startBlink();
  } else {
    stopBlink();
  }
  syncLadder();
}
function ladderUp() {
  if (spinning || lastWin <= 0 || freeSpins > 0 || !riskOpen) return;
  const currentWin = lastWin;
  const upLabel = upRiskLabel();
  const downLabel = downRiskLabel();

  stopBlink();
  changeCash(-currentWin);

  if (blinkTarget === 'up' && upLabel) {
    ladderLevel += 1;
    lastWin = scaledRiskWin(upLabel);
    changeCash(lastWin);
    el('lastWinOut').textContent = money(lastWin);
    el('msg').textContent = `🪜 Hochgedrückt auf Stufe ${upLabel} · ${money(lastWin)}`;
  } else if (blinkTarget === 'down') {
    if (downLabel === LOSS_STEP) {
      lastWin = 0;
      ladderLevel = -1;
      riskOpen = false;
      riskScale = 1;
      el('lastWinOut').textContent = money(0);
      el('msg').textContent = '🪜 Verloren.';
      syncLadder();
      return;
    } else if (downLabel) {
      ladderLevel -= 1;
      lastWin = scaledRiskWin(downLabel);
      changeCash(lastWin);
      el('lastWinOut').textContent = money(lastWin);
      el('msg').textContent = `🪜 Runter auf Stufe ${downLabel} · ${money(lastWin)}`;
    }
  } else {
    lastWin = currentWin;
    changeCash(lastWin);
    el('lastWinOut').textContent = money(lastWin);
    el('msg').textContent = '🪜 Keine höhere Stufe verfügbar.';
  }

  if (lastWin > 0 && ladderLevel === ALL_LADDER_STEPS.length - 1) {
    el('msg').textContent = `🪜 Oberste Stufe erreicht! Gewinn automatisch genommen: ${money(lastWin)}`;
    riskOpen = false;
    stopBlink();
    clearRisk(false);
    syncLadder();
    return;
  }

  if (riskOpen && lastWin > 0) {
    const hasUp = !!upRiskLabel();
    const hasDown = !!downRiskLabel();
    if (hasUp && hasDown) blinkTarget = Math.random() < 0.5 ? 'up' : 'down';
    else if (hasUp) blinkTarget = 'up';
    else blinkTarget = 'down';
    startBlink();
  }
  syncLadder();
}
function syncLadder() {
  const active = lastWin > 0 && freeSpins === 0;
  const ladder = el('riskLadder');
  const board = el('slotBoard');
  const stepsEl = el('ladderSteps');
  const title = el('ladderTitle');
  const ladderBtn = el('ladderBtn');
  const panelBtn = el('ladderPanelBtn');

  if (ladder) ladder.classList.toggle('on', active && riskOpen);
  if (board) board.classList.toggle('risk-mode', active && riskOpen);
  if (active && riskOpen) startBlink(); else stopBlink();

  if (ladderBtn) {
    ladderBtn.disabled = !active;
    ladderBtn.classList.toggle('risk-ready', active);
    ladderBtn.textContent = active ? (riskOpen ? 'Leiter schließen' : 'Leiter öffnen') : 'Leiter';
  }
  if (panelBtn) {
    panelBtn.disabled = !active || !riskOpen;
    panelBtn.textContent = 'Drücken';
  }
  if (title) title.textContent = 'Risikoleiter';

  if (stepsEl) {
    stepsEl.innerHTML = '';
    const current = active ? currentRiskLabel() : null;
    const up = active ? upRiskLabel() : null;
    const down = active ? downRiskLabel() : null;
    const visibleCount = 6;
    let displaySteps = ALL_LADDER_STEPS.slice();
    if (active && ladderLevel >= 0) {
      const maxStart = Math.max(0, ALL_LADDER_STEPS.length - visibleCount);
      const start = Math.max(0, Math.min(ladderLevel - 2, maxStart));
      const end = Math.min(ALL_LADDER_STEPS.length, start + visibleCount);
      displaySteps = ALL_LADDER_STEPS.slice(start, end);
    } else {
      displaySteps = ALL_LADDER_STEPS.slice(0, visibleCount);
    }
    displaySteps = displaySteps.concat([LOSS_STEP]).slice().reverse();

    displaySteps.forEach((label) => {
      const step = document.createElement('div');
      const isLoss = label === LOSS_STEP;
      const isCurrent = active && !isLoss && label === current;
      const isUp = active && !isLoss && label === up;
      const isDown = active && label === down;
      const isBlinkUp = isUp && riskOpen && blinkTarget === 'up';
      const isBlinkDown = isDown && riskOpen && blinkTarget === 'down';
      step.className = 'ladder-step'
        + (isCurrent ? ' current' : '')
        + (isUp ? ' option-up' : '')
        + (isDown ? ' option-down' : '')
        + (isBlinkUp ? ' blink-up' : '')
        + (isBlinkDown ? ' blink-down' : '');
      const amount = isLoss ? '0 €' : (active ? money(scaledRiskWin(label)) : '–');
      step.innerHTML = isLoss ? `<span>Verloren</span><b>${amount}</b>` : `<span>Stufe ${label}</span><b>${amount}</b>`;
      stepsEl.appendChild(step);
    });
  }
}

function buildPaytable() {
  const p = el('paytable');
  p.innerHTML = SYMBOLS.map(s => {
    const pays = Object.keys(s.pay).sort().map(k => `${k}x ${s.pay[k]}×`).join(' · ');
    return `<div class="payitem"><b>${s.icon}</b>${s.name}<br>${pays}${s.scatter ? '<br>3+ = Freispiele' : ''}</div>`;
  }).join('');
}
function showPaytable() {
  const p = el('paytable');
  p.style.display = p.style.display === 'none' ? 'grid' : 'none';
}
</script>
