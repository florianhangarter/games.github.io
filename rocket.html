<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocket Blast</title>
<link rel="stylesheet" href="styles.css">
<script src="casino-utils.js"></script>
<style>
  .rocket-stage{height:310px;background:radial-gradient(circle at 50% 10%,#16243a 0%,#0a1321 45%,#060a12 100%);border-radius:22px;border:2px solid #26344f;position:relative;overflow:hidden;box-shadow:inset 0 0 45px rgba(0,0,0,.55)}
  #mult{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;font-size:58px;font-weight:900;text-shadow:0 5px 18px #000;padding-top:34px;pointer-events:none;transition:color .18s ease}
  .rocket-history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px auto 0;max-width:760px}
  .rocket-history span{font-size:13px;font-weight:900;border-radius:999px;padding:6px 10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)}
  .rocket-history .good{color:#79e398;border-color:rgba(121,227,152,.45)}
  .rocket-history .bad{color:#ff8383;border-color:rgba(255,131,131,.45)}

  /* FINAL rocket viewport fit */
  .rocket-stage{height:clamp(170px,34vh,310px)}
  @media(max-height:760px){
    .rocket-history{margin-top:8px;gap:5px}
    .rocket-history span{font-size:10px;padding:4px 7px}
    #mult{font-size:clamp(34px,8vw,48px);padding-top:18px}
  }

</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <button class="danger" onclick="goLobby()">🏰 Lobby</button>
    <div class="counter-display">Bank: <span class="shared-bankroll">1000 €</span></div>
    <div class="counter-display">Einsatz: <span id="betOut">10 €</span></div>
    <div class="counter-display">Auszahlung: <span id="payout">0 €</span></div>
  </div>
  <section class="panel">
    <h1 class="title" style="font-size:38px">🚀 Rocket Blast</h1>
    <div class="betbox">
      <label for="betSlider">Einsatz</label>
      <b id="betDisplay">10 €</b>
      <input id="betSlider" type="range">
    </div>
    <div class="rocket-stage">
      <canvas id="cv" style="width:100%;height:100%"></canvas>
      <div id="mult">1.00x</div>
    </div>
    <div class="rocket-history" id="rocketHistory"></div>
    <div id="msg" class="message"></div>
    <div class="controls"><button class="success" id="mainBtn" type="button">Start</button></div>
  </section>
</main>
<script>
let getBet;
let state = 'idle';
let crash = 1;
let t0 = 0;
let m = 1;
let raf = null;
let activeBet = 0;
let cashedOut = false;
let cashoutMultiplier = 0;
let securedWin = 0;
let rocketPos = { x: 70, y: 240 };
let trail = [];
let stars = [];
let explosion = null;
const c = document.getElementById('cv');
const ctx = c.getContext('2d');
const historyItems = [];

function size() {
  c.width = c.clientWidth;
  c.height = c.clientHeight;
  makeStars();
  resetRocketVisuals();
  draw(0);
}
window.addEventListener('resize', size);
document.addEventListener('DOMContentLoaded', () => {
  size();
  getBet = createBetSlider({ inputId:'betSlider', displayId:'betDisplay', min:1, max:500, value:10, onChange:v => { document.getElementById('betOut').textContent = money(v); } });
  document.getElementById('mainBtn').addEventListener('click', action);
  renderHistory();
});
function makeStars() {
  stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * c.width,
    y: Math.random() * c.height,
    s: Math.random() * 2 + .3,
    a: Math.random() * .8 + .15
  }));
}
function crashPoint() {
  const e = Math.random();
  return e < 0.04 ? 1 : Math.min(50, Number((0.96 / (1 - e)).toFixed(2)));
}
function addHistory(multiplier, cashed) {
  historyItems.unshift({ multiplier, cashed });
  while (historyItems.length > 14) historyItems.pop();
  renderHistory();
}
function renderHistory() {
  const box = document.getElementById('rocketHistory');
  box.innerHTML = historyItems.length
    ? historyItems.map(h => `<span class="${h.cashed ? 'good' : 'bad'}">${h.cashed ? '✓' : '💥'} ${h.multiplier.toFixed(2)}x</span>`).join('')
    : '<span>Verlauf erscheint nach der ersten Runde</span>';
}
function resetRocketVisuals() {
  rocketPos = { x: 70, y: c.height - 60 };
  trail = [{ x: rocketPos.x, y: rocketPos.y }];
  explosion = null;
}
function action() {
  const btn = document.getElementById('mainBtn');
  if (state === 'idle') {
    const bet = getBet();
    if (!canAfford(bet)) return toast('Nicht genug Guthaben.', 'bad');
    activeBet = bet;
    changeCash(-activeBet);
    crash = crashPoint();
    state = 'fly';
    t0 = performance.now();
    resetRocketVisuals();
    btn.textContent = 'Cash Out';
    btn.className = 'primary';
    document.getElementById('msg').textContent = 'Die Rakete hebt ab...';
    document.getElementById('mult').style.color = '#ffffff';
    loop();
  } else if (state === 'fly' && !cashedOut) {
    securedWin = Math.floor(activeBet * m);
    cashoutMultiplier = m;
    cashedOut = true;
    changeCash(securedWin);
    recordGame('Rocket', securedWin - activeBet);
    addHistory(m, true);
    document.getElementById('msg').textContent = `Gesichert bei ${m.toFixed(2)}x: ${money(securedWin)} — Rakete fliegt weiter...`;
    document.getElementById('mult').style.color = '#79e398';
    btn.textContent = 'Gesichert';
    btn.disabled = true;
  }
}
function loop() {
  if (state !== 'fly') return;
  const elapsed = (performance.now() - t0) / 1000;
  m = Number(Math.pow(1.19, elapsed).toFixed(2));
  updateRocket(elapsed);
  if (m >= crash) {
    m = crash;
    state = 'crashed';
    document.getElementById('mult').textContent = m.toFixed(2) + 'x';
    document.getElementById('mult').style.color = cashedOut ? '#79e398' : '#ff8a8a';
    document.getElementById('msg').textContent = cashedOut
      ? `Crash bei ${m.toFixed(2)}x 💥 — du warst bei ${cashoutMultiplier.toFixed(2)}x draußen.`
      : `Crash bei ${m.toFixed(2)}x 💥`;
    if (!cashedOut) {
      recordGame('Rocket', -activeBet);
      addHistory(m, false);
    }
    explosion = { x: rocketPos.x, y: rocketPos.y, t: performance.now() };
    document.getElementById('mainBtn').disabled = true;
    draw(elapsed);
    setTimeout(reset, 1500);
    return;
  }
  document.getElementById('mult').textContent = m.toFixed(2) + 'x';
  document.getElementById('payout').textContent = money(activeBet * m);
  if (!cashedOut) document.getElementById('mult').style.color = m < 2 ? '#fff' : (m < 5 ? '#ffe68f' : '#ffb347');
  draw(elapsed);
  raf = requestAnimationFrame(loop);
}
function updateRocket(elapsed) {
  const progress = Math.min(1, elapsed / 8);
  rocketPos.x = 70 + progress * (c.width - 150);
  rocketPos.y = c.height - 55 - Math.pow(progress, 1.35) * (c.height - 110) - Math.sin(elapsed * 6) * 2;
  trail.push({ x: rocketPos.x, y: rocketPos.y });
  if (trail.length > 90) trail.shift();
}
function drawBackground(time) {
  const g = ctx.createLinearGradient(0, 0, 0, c.height);
  g.addColorStop(0, '#17243a');
  g.addColorStop(.5, '#0b1221');
  g.addColorStop(1, '#060a12');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, c.width, c.height);
  stars.forEach((s, i) => {
    ctx.globalAlpha = s.a + Math.sin(time * 2 + i) * 0.08;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const y = (c.height / 6) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(c.width, y); ctx.stroke();
  }
  for (let i = 1; i < 8; i++) {
    const x = (c.width / 8) * i;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke();
  }
}
function drawTrail() {
  if (trail.length < 2) return;
  ctx.lineWidth = 5;
  for (let i = 1; i < trail.length; i++) {
    const p0 = trail[i - 1], p1 = trail[i];
    const alpha = i / trail.length;
    ctx.strokeStyle = `rgba(255, 196, 87, ${alpha * .5})`;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
  }
}
function drawRocketBody(x, y, flameScale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.5);
  ctx.fillStyle = '#dfe8f1';
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.lineTo(12, -10); ctx.lineTo(22, 0); ctx.lineTo(12, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d74848';
  ctx.fillRect(-10, -10, 10, 20);
  ctx.fillStyle = '#7fc4ff';
  ctx.beginPath(); ctx.arc(2, 0, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c73c3c';
  ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(-20, -18); ctx.lineTo(-12, -4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(-20, 18); ctx.lineTo(-12, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffb347';
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-32 - Math.random() * 8 * flameScale, -7 * flameScale); ctx.lineTo(-30 - Math.random() * 8 * flameScale, 7 * flameScale); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,120,.7)';
  ctx.beginPath(); ctx.moveTo(-17, 0); ctx.lineTo(-27 - Math.random() * 5 * flameScale, -4 * flameScale); ctx.lineTo(-25 - Math.random() * 5 * flameScale, 4 * flameScale); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawExplosion() {
  if (!explosion) return;
  const age = (performance.now() - explosion.t) / 1000;
  const radius = 12 + age * 65;
  ctx.save();
  ctx.globalAlpha = Math.max(0, 1 - age * .9);
  const grad = ctx.createRadialGradient(explosion.x, explosion.y, 4, explosion.x, explosion.y, radius);
  grad.addColorStop(0, 'rgba(255,255,180,.95)');
  grad.addColorStop(.45, 'rgba(255,170,0,.8)');
  grad.addColorStop(1, 'rgba(255,50,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(explosion.x, explosion.y, radius, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function draw(time) {
  drawBackground(time);
  drawTrail();
  ctx.strokeStyle = 'rgba(229,193,88,.35)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(30, c.height - 34);
  for (let x = 0; x < c.width - 60; x += 8) {
    const y = c.height - 34 - Math.pow(x / (c.width - 60), 1.7) * (c.height - 85);
    ctx.lineTo(30 + x, y);
  }
  ctx.stroke();
  if (state !== 'crashed') drawRocketBody(rocketPos.x, rocketPos.y, state === 'fly' ? 1.15 : .7);
  drawExplosion();
}
function reset() {
  cancelAnimationFrame(raf);
  state = 'idle';
  m = 1;
  activeBet = 0;
  cashedOut = false;
  cashoutMultiplier = 0;
  securedWin = 0;
  document.getElementById('mult').textContent = '1.00x';
  document.getElementById('mult').style.color = '#fff';
  document.getElementById('payout').textContent = '0 €';
  const btn = document.getElementById('mainBtn');
  btn.textContent = 'Start';
  btn.className = 'success';
  btn.disabled = false;
  document.getElementById('msg').textContent = '';
  resetRocketVisuals();
  draw(0);
}
</script>
</body>
</html>
