<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plinko</title>
<link rel="stylesheet" href="styles.css">
<script src="casino-utils.js"></script>
<style>
  body{
    background:
      radial-gradient(circle at 50% 8%,#9ec9d7 0%,#31505e 28%,#182b35 54%,#081016 100%);
  }
  .plinko-shell{
    max-width:920px;margin:auto;position:relative;overflow:hidden;
    background:linear-gradient(145deg,#263d49,#0e1920);
    border:2px solid #c9a45e;
    box-shadow:0 26px 60px rgba(0,0,0,.58),0 0 34px rgba(201,164,94,.15)
  }
  .plinko-shell:before{
    content:"ROYAL DROP";
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:4px;color:#f1ddaf;opacity:.74;font-weight:900
  }
  .plinko-title{
    font-size:38px;margin-top:12px;
    background:linear-gradient(#f7e4b3,#d3aa61,#8e6523);
    -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none
  }
  .plinko-config{display:grid;grid-template-columns:1fr;gap:8px;max-width:760px;margin:0 auto}
  .ball-seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px auto 0}
  .ball-seg button.active{background:linear-gradient(#d8bb55,#9c7620);color:#181008;border-color:#ffe9a4}
  .plinko-live{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:760px;margin:12px auto 0}
  .plinko-live .counter-display{text-align:center;border-radius:16px}
  .plinko-help{text-align:center;color:rgba(255,255,255,.62);font-size:13px;margin-top:10px;letter-spacing:.2px}
  .plinko-status-wrap{text-align:center}
  .plinko-status{
    font-size:12px;color:#edd8aa;text-align:center;margin:10px auto 0;
    display:inline-flex;justify-content:center;align-items:center;
    padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.22);
    border:1px solid rgba(201,164,94,.18);min-width:190px
  }
  .plinko-board{
    position:relative;max-width:760px;margin:18px auto 8px;padding:16px;border-radius:24px;
    background:linear-gradient(180deg,#101c21,#162a31 58%,#0d1519 100%);
    border:2px solid rgba(201,164,94,.26);
    box-shadow:inset 0 0 30px rgba(0,0,0,.52),0 0 18px rgba(201,164,94,.08)
  }
  .plinko-board:before{content:"";position:absolute;inset:12px;border-radius:20px;border:1px solid rgba(241,221,175,.06);pointer-events:none}
  #plinkoCanvas{position:relative;z-index:1;width:100%;height:520px;display:block;border-radius:18px;background:radial-gradient(circle at 50% 10%,rgba(255,255,255,.045),rgba(0,0,0,.18) 70%)}
  .bucket-row{display:grid;gap:6px;max-width:760px;margin:0 auto;position:relative;z-index:2}
  .bucket{
    text-align:center;padding:8px 4px;border-radius:12px;font-size:12px;font-weight:950;
    color:#351f0b;background:linear-gradient(180deg,#f7e4b3,#cfa25a);
    border:1px solid rgba(255,239,180,.45);box-shadow:inset 0 1px 4px rgba(255,255,255,.18)
  }
  .bucket.hot{background:linear-gradient(180deg,#ffdf7a,#c78225);color:#241302;box-shadow:0 0 20px rgba(229,193,88,.24)}
  .bucket.bad{background:linear-gradient(180deg,#455a64,#1b2c34);color:#dce7ea;border-color:rgba(255,255,255,.08)}
  .plinko-history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:760px;margin:10px auto 0}
  .plinko-history span{font-size:12px;font-weight:900;border-radius:999px;padding:5px 9px;background:rgba(0,0,0,.32);border:1px solid rgba(229,193,88,.18);color:#f0cc77}
  .plinko-history .loss{color:#b8c7ce;border-color:rgba(255,255,255,.12)}
  .plinko-history .win{color:#93f0ae;border-color:rgba(147,240,174,.34)}
  @media(max-height:820px){#plinkoCanvas{height:430px}.plinko-board{padding:12px}.bucket{font-size:11px;padding:6px 3px}.plinko-title{font-size:34px}#msg{font-size:18px;margin:8px 0}}
  @media(max-width:680px){#plinkoCanvas{height:420px}.bucket-row{gap:4px}.bucket{font-size:10px}.plinko-title{font-size:34px}.plinko-board{padding:10px}}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <button class="danger" onclick="goLobby()">🏰 Lobby</button>
    <div class="counter-display">Bank: <span class="shared-bankroll">1000 €</span></div>
    <div class="counter-display">Einsatz: <span id="betOut">10 €</span></div>
    <div class="counter-display">Gewinn: <span id="winOut">0 €</span></div>
  </div>

  <section class="panel plinko-shell">
    <h1 class="title plinko-title">🟡 Plinko</h1>
    <div class="betbox">
      <label for="betSlider">Einsatz</label>
      <b id="betDisplay">10 €</b>
      <input id="betSlider" type="range">
    </div>

    <div class="plinko-config">
      <div class="seg" id="riskBtns">
        <button class="active" data-risk="low" type="button">Sicher</button>
        <button data-risk="medium" type="button">Normal</button>
        <button data-risk="high" type="button">Riskant</button>
      </div>
      <div class="ball-seg" id="ballBtns">
        <button class="active" data-balls="1" type="button">1 Ball</button>
        <button data-balls="5" type="button">5 Balls</button>
        <button data-balls="10" type="button">10 Balls</button>
        <button data-balls="25" type="button">25 Balls</button>
        <button data-balls="50" type="button">50 Balls</button>
        <button data-balls="100" type="button">100 Balls</button>
      </div>
    </div>
    <div class="plinko-help">Wähle Risiko, Einsatz pro Ball und Ball-Anzahl. Beim Drop fallen mehrere Kugeln gleichzeitig durch die Pins.</div>
    <div class="plinko-live">
      <div class="counter-display">Balls: <span id="ballsOut">1</span></div>
      <div class="counter-display">Gesamteinsatz: <span id="totalBetOut">10 €</span></div>
      <div class="counter-display">Geladet: <span id="landedOut">0 / 1</span></div>
    </div>
    <div class="plinko-status-wrap"><div class="plinko-status" id="stateOut">Status: bereit</div></div>

    <div class="plinko-board">
      <canvas id="plinkoCanvas"></canvas>
      <div class="bucket-row" id="bucketRow"></div>
    </div>
    <div class="plinko-history" id="history"></div>
    <div id="msg" class="message"></div>
    <div class="controls">
      <button class="success" id="dropBtn" type="button">Drop</button>
    </div>
  </section>
</main>

<script>
let getBet;
let risk = 'low';
let running = false;
let balls = [];
let raf = null;
let pins = [];
let buckets = [];
let historyItems = [];
let activeBet = 0;
let ballCount = 1;
let totalWin = 0;
let landedCount = 0;
let dropStartTime = 0;

const multipliers = {
  low:    [0.4,0.6,0.8,1.0,1.3,1.0,0.8,0.6,0.4],
  medium: [0.2,0.5,0.8,1.2,2.0,1.2,0.8,0.5,0.2],
  high:   [0.0,0.2,0.5,1.0,5.0,1.0,0.5,0.2,0.0]
};

const el = id => document.getElementById(id);
const canvas = el('plinkoCanvas');
const ctx = canvas.getContext('2d');

window.addEventListener('DOMContentLoaded', () => {
  getBet = createBetSlider({
    inputId:'betSlider', displayId:'betDisplay', min:1, max:500, value:10,
    onChange:v => { el('betOut').textContent = money(v); updateTotalBet(); }
  });

  el('riskBtns').addEventListener('click', event => {
    const btn = event.target.closest('button[data-risk]');
    if (!btn || running) return;
    risk = btn.dataset.risk;
    document.querySelectorAll('#riskBtns button').forEach(b => b.classList.toggle('active', b === btn));
    renderBuckets();
    draw();
  });

  el('ballBtns').addEventListener('click', event => {
    const btn = event.target.closest('button[data-balls]');
    if (!btn || running) return;
    ballCount = Number(btn.dataset.balls) || 1;
    document.querySelectorAll('#ballBtns button').forEach(b => b.classList.toggle('active', b === btn));
    updateTotalBet();
  });

  el('dropBtn').addEventListener('click', dropBalls);
  window.addEventListener('resize', sizeCanvas);
  sizeCanvas();
  renderBuckets();
  renderHistory();
  updateTotalBet();
  setStatus('Status: bereit');
});

function sizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * window.devicePixelRatio);
  canvas.height = Math.floor(rect.height * window.devicePixelRatio);
  ctx.setTransform(window.devicePixelRatio,0,0,window.devicePixelRatio,0,0);
  buildBoard();
  draw();
}

function boardSize(){ return { w: canvas.clientWidth, h: canvas.clientHeight }; }

function buildBoard(){
  const {w,h} = boardSize();
  pins = [];
  const rows = 8;
  const top = 70;
  const bottom = h - 82;
  const gapY = (bottom - top) / (rows - 1);
  for (let r=0;r<rows;r++){
    const count = r + 2;
    const gapX = Math.min(66, w / (count + 2));
    const startX = w/2 - ((count - 1) * gapX)/2;
    for (let c=0;c<count;c++) pins.push({x:startX + c*gapX, y:top + r*gapY, r:5, row:r});
  }
  buckets = [];
  const m = multipliers[risk];
  const bucketW = w / m.length;
  for (let i=0;i<m.length;i++) buckets.push({x:i*bucketW + bucketW/2, y:h-26, w:bucketW, mult:m[i]});
}

function renderBuckets(){
  const row = el('bucketRow');
  const m = multipliers[risk];
  row.style.gridTemplateColumns = `repeat(${m.length},1fr)`;
  row.innerHTML = m.map(v => `<div class="bucket ${v >= 2 ? 'hot' : v < 0.5 ? 'bad' : ''}">${formatMult(v)}x</div>`).join('');
  buildBoard();
}

function updateTotalBet(){
  const bet = getBet ? getBet() : 10;
  el('ballsOut').textContent = ballCount;
  el('totalBetOut').textContent = money(bet * ballCount);
  el('landedOut').textContent = `${landedCount} / ${ballCount}`;
}

function makePath(startOffset){
  const {w,h} = boardSize();
  const rows = 8;
  let col = 4;
  const path = [{x:w/2 + startOffset,y:28}];
  for (let r=0;r<rows;r++){
    col += Math.random() < 0.5 ? 0 : 1;
    const rowY = 70 + r*((h-82-70)/(rows-1));
    const rowPins = pins.filter(p => Math.abs(p.y - rowY) < 2);
    const pin = rowPins[Math.max(0, Math.min(rowPins.length-1, col - Math.floor((8-rowPins.length)/2)))] || rowPins[Math.floor(rowPins.length/2)];
    const offset = (Math.random() < 0.5 ? -1 : 1) * (13 + Math.random() * 10);
    path.push({x:pin.x + offset, y:pin.y + 18});
  }
  const finalIndex = Math.max(0, Math.min(multipliers[risk].length-1, col));
  path.push({x:buckets[finalIndex].x + (Math.random()-.5)*10,y:h-52, finalIndex});
  return { path, finalIndex };
}

function dropBalls(){
  if (running) return;
  activeBet = getBet();
  const totalBet = activeBet * ballCount;
  if (!canAfford(totalBet)) { toast('Nicht genug Guthaben für alle Balls.', 'error'); return; }
  changeCash(-totalBet);
  el('winOut').textContent = money(0);
  el('msg').textContent = '';
  running = true;
  balls = [];
  totalWin = 0;
  landedCount = 0;
  updateTotalBet();
  setControlsDisabled(true);
  setStatus(`Status: ${ballCount} Kugel${ballCount === 1 ? '' : 'n'} fallen`);

  for (let i=0;i<ballCount;i++){
    const delay = ballCount === 1 ? 0 : i * Math.max(14, 90 - ballCount);
    const startOffset = (Math.random() - .5) * 28;
    const made = makePath(startOffset);
    balls.push({
      path: made.path,
      target: made.finalIndex,
      index: 1,
      x: made.path[0].x,
      y: made.path[0].y,
      r: ballCount > 50 ? 6 : ballCount > 20 ? 7 : 10,
      glow: 0,
      squash: 0,
      from: null,
      to: null,
      start: 0,
      duration: 0,
      delay,
      started: false,
      done: false,
      colorShift: Math.random()
    });
  }

  dropStartTime = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(animate);
}

function setControlsDisabled(disabled){
  el('dropBtn').disabled = disabled;
  document.querySelectorAll('#riskBtns button,#ballBtns button').forEach(b => b.disabled = disabled);
  const slider = el('betSlider');
  if (slider) slider.disabled = disabled;
}

function startNextSegment(ball, time){
  ball.from = { x: ball.x, y: ball.y };
  ball.to = ball.path[ball.index] || null;
  ball.start = time;
  ball.duration = ball.index === ball.path.length - 1 ? 380 : 245 + Math.random() * 90;
}

function easeInOutCubic(t){
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function animate(time){
  let active = false;

  for (const b of balls){
    if (b.done) continue;
    active = true;

    if (!b.started){
      if (time < dropStartTime + b.delay) continue;
      b.started = true;
      startNextSegment(b, time);
    }

    if (!b.to){
      finishBall(b);
      continue;
    }

    const raw = Math.min(1, (time - b.start) / b.duration);
    const eased = easeInOutCubic(raw);
    const arc = Math.sin(raw * Math.PI) * (11 + (b.r * .35));
    b.x = b.from.x + (b.to.x - b.from.x) * eased;
    b.y = b.from.y + (b.to.y - b.from.y) * eased - arc;
    b.glow = Math.max(0, b.glow - 0.035);
    b.squash = Math.sin(raw * Math.PI) * 0.08;

    if (raw >= 1){
      b.x = b.to.x;
      b.y = b.to.y;
      b.glow = 1;
      b.squash = 0.13;
      b.index++;
      startNextSegment(b, time);
    }
  }

  draw();
  if (active) raf = requestAnimationFrame(animate);
  else finishDrop();
}

function finishBall(b){
  if (b.done) return;
  b.done = true;
  const mult = multipliers[risk][b.target];
  const win = Math.floor(activeBet * mult);
  totalWin += win;
  landedCount++;
  el('winOut').textContent = money(totalWin);
  el('landedOut').textContent = `${landedCount} / ${ballCount}`;
  addMiniBucketFlash(b.target);
}

function finishDrop(){
  if (totalWin > 0) changeCash(totalWin);
  const totalBet = activeBet * ballCount;
  recordGame('plinko', totalWin - totalBet);
  const profit = totalWin - totalBet;
  el('winOut').textContent = money(totalWin);
  el('msg').textContent = profit > 0
    ? `Gesamtgewinn: ${money(totalWin)} | Profit: +${money(profit)}`
    : `Gesamtauszahlung: ${money(totalWin)} | Verlust: ${money(Math.abs(profit))}`;
  addHistoryBatch(totalWin, profit);
  running = false;
  setControlsDisabled(false);
  setStatus('Status: bereit');
  draw();
}

function addMiniBucketFlash(index){
  const bucketEls = [...document.querySelectorAll('.bucket')];
  const b = bucketEls[index];
  if (!b) return;
  b.classList.add('hot');
  setTimeout(() => renderBuckets(), 160);
}

function draw(){
  const {w,h} = boardSize();
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.fillStyle = 'rgba(229,193,88,.10)';
  ctx.font = '900 12px Segoe UI, Arial';
  ctx.textAlign = 'center';
  ctx.fillText('DROP ZONE', w/2, 32);

  for (const p of pins){
    const hit = balls.some(b => !b.done && Math.hypot(b.x-p.x, b.y-p.y) < 25);
    const g = ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,hit?16:10);
    g.addColorStop(0, hit ? '#fff2b6' : '#f1ddaf');
    g.addColorStop(1, hit ? 'rgba(229,193,88,.25)' : 'rgba(201,164,94,.08)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x,p.y,hit?7:5,0,Math.PI*2); ctx.fill();
  }

  const m = multipliers[risk];
  const bucketW = w / m.length;
  for (let i=0;i<m.length;i++){
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(i*bucketW+3,h-70,bucketW-6,52);
    ctx.strokeStyle = 'rgba(241,221,175,.10)';
    ctx.strokeRect(i*bucketW+3,h-70,bucketW-6,52);
  }

  for (const b of balls){
    if (!b.started && running) continue;
    const g = ctx.createRadialGradient(b.x-3,b.y-4,2,b.x,b.y,b.r+10+(b.glow*8));
    g.addColorStop(0,'#fff4bb');
    g.addColorStop(.48,'#e5c158');
    g.addColorStop(1,'rgba(229,193,88,.08)');
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(1 + b.squash, 1 - b.squash * 0.55);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,b.r+b.glow*2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function addHistoryBatch(win, profit){
  historyItems.unshift({balls: ballCount, win, profit});
  if (historyItems.length > 10) historyItems.pop();
  renderHistory();
}
function renderHistory(){
  el('history').innerHTML = historyItems.map(item => `<span class="${item.profit > 0 ? 'win' : 'loss'}">${item.balls}x · ${money(item.win)}</span>`).join('');
}
function formatMult(v){ return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function setStatus(text){ el('stateOut').textContent = text; }
</script>
</body>
</html>
