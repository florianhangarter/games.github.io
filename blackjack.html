<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blackjack</title>
<link rel="stylesheet" href="styles.css">
<script src="casino-utils.js"></script>
<style>
  .blackjack-table{
    position:relative;
    background:radial-gradient(ellipse at center, rgba(34,121,73,.98) 0%, rgba(9,64,36,.99) 50%, rgba(71,49,29,.98) 51%, rgba(36,22,13,.99) 67%, rgba(9,7,6,1) 83%);
    border:4px solid rgba(123,81,40,.95);
    border-radius:220px 220px 34px 34px;
    padding:36px 24px 26px;
    box-shadow:inset 0 0 72px rgba(0,0,0,.52), inset 0 0 0 10px rgba(110,73,38,.72), inset 0 0 0 18px rgba(24,16,10,.92), 0 28px 55px rgba(0,0,0,.46);
    overflow:hidden;
  }
  .blackjack-table:before{content:'BLACKJACK PAYS 3 TO 2';position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:4px;color:rgba(255,240,163,.86);font-weight:900;background:rgba(0,0,0,.25);padding:7px 14px;border-radius:999px;border:1px solid rgba(229,193,88,.35)}
  .blackjack-table:after{content:'DEALER MUST STAND ON 17';position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;color:rgba(255,240,163,.62);font-weight:800}
  .blackjack-table .table-arc{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);width:min(88%,680px);height:170px;border:3px solid rgba(229,193,88,.32);border-color:rgba(229,193,88,.32) transparent transparent transparent;border-radius:50% 50% 0 0 / 100% 100% 0 0;pointer-events:none}
  .blackjack-table .table-arc:before{content:'INSURANCE PAYS 2 TO 1';position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:2px;color:rgba(255,240,163,.68);font-weight:800;background:rgba(6,26,15,.9);padding:2px 10px;border-radius:999px;white-space:nowrap}
  .bj-area{position:relative;background:rgba(5,34,18,.16);border:1px solid rgba(229,193,88,.16);border-radius:30px;padding:18px 14px;margin:16px 0;text-align:center;box-shadow:inset 0 0 24px rgba(0,0,0,.25)}
  .bj-area.dealer{margin-bottom:22px}
  .bj-area.player{margin-top:78px}
  .bj-area.player:before,.bj-area.dealer:before{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;font-weight:900;color:rgba(255,240,163,.82);background:rgba(6,26,15,.95);border:1px solid rgba(229,193,88,.32);padding:4px 12px;border-radius:999px}
    .bj-area.dealer:before{content:none !important;display:none !important}
  .bj-label{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;color:var(--gold);font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .bj-area .hand-zone{min-height:150px}
  .blackjack-table .card{box-shadow:0 10px 22px rgba(0,0,0,.45)}
  @media(max-width:780px){.blackjack-table{border-radius:50px 50px 24px 24px;padding:28px 16px 20px}.blackjack-table .table-arc{width:90%;bottom:98px;height:148px}.bj-area.player{margin-top:92px}}

  /* Entfernt die PLAYER-Beschriftung am Blackjack-Tisch */
  .bj-area.player:before{content:none !important;display:none !important}

  /* FINAL blackjack viewport fit */
  .bj-area.player:before{content:none !important;display:none !important}
  @media(max-height:820px){
    .blackjack-table{padding:26px 14px 18px;border-radius:90px 90px 24px 24px}
    .blackjack-table:before{top:10px;font-size:10px;padding:4px 10px}
    .blackjack-table:after{bottom:8px;font-size:9px}
    .blackjack-table .table-arc{bottom:66px;height:118px}
    .blackjack-table .table-arc:before{top:-22px;font-size:9px}
    .bj-area{padding:10px 8px;margin:8px 0;border-radius:18px}
    .bj-area.dealer{margin-bottom:8px}
    .bj-area.player{margin-top:44px}
    .bj-area .hand-zone{min-height:90px}
    .bj-label{font-size:12px;margin-bottom:4px}
  }
  @media(max-height:680px){
    .blackjack-table{padding:22px 8px 14px}
    .blackjack-table .table-arc{display:none}
    .blackjack-table:after{display:none}
    .bj-area.player{margin-top:12px}
    .bj-area.player:before,.bj-area.dealer:before{display:none}
  }
  @media(max-width:760px){
    .blackjack-table{border-radius:44px 44px 20px 20px}
    .blackjack-table:before{letter-spacing:2px;white-space:nowrap}
  }


  /* Entfernt nur die extra Tisch-Markierung DEALER, nicht die normale Dealer-Zeile */
  .bj-area.dealer:before{content:none !important;display:none !important}
  .bj-area.player:before{content:none !important;display:none !important}
</style>
</head>
<body>
<main class="page">
<div class="topbar">
  <button class="danger" onclick="goLobby()">🏰 Lobby</button>
  <div class="counter-display">Bank: <span class="shared-bankroll">1000 €</span></div>
  <div class="counter-display">Einsatz: <span id="betOut">10 €</span></div>
</div>
<section class="panel">
  <h1 class="title" style="font-size:38px">♦ Blackjack</h1>
  <div class="betbox" id="betbox"><label for="betSlider">Einsatz</label><b id="betDisplay">10 €</b><input id="betSlider" type="range"></div>
  <div class="chip-rack" id="betChips">
  <button type="button" class="chip-btn chip-white" data-chip="5">5</button>
  <button type="button" class="chip-btn chip-red" data-chip="10">10</button>
  <button type="button" class="chip-btn chip-green" data-chip="25">25</button>
  <button type="button" class="chip-btn chip-black" data-chip="50">50</button>
  <button type="button" class="chip-btn chip-gold" data-chip="100">100</button>
</div>
  <div class="blackjack-table"><div class="table-arc"></div>
    <div class="bj-area dealer">
      <div class="bj-label"><span>Dealer</span><span class="score-badge">Score: <span id="dealerScore">?</span></span></div>
      <div id="dealerHand" class="hand-zone"></div>
    </div>
    <div class="bj-area player">
      <div class="bj-label"><span>Spieler</span><span class="score-badge">Score: <span id="playerScore">0</span></span></div>
      <div id="playerHand" class="hand-zone"></div>
    </div>
  </div>
  <div id="msg" class="message"></div>
  <div class="controls"><button id="dealBtn" class="success" onclick="deal()">Geben</button><button id="hitBtn" onclick="hit()" disabled>Hit</button><button id="standBtn" onclick="stand()" disabled>Stand</button><button id="doubleBtn" class="primary" onclick="doubleDown()" disabled>Verdoppeln</button></div>
</section></main>
<script>
let deck=[], player=[], dealer=[], state='betting', getBet, roundBet=0;
document.addEventListener('DOMContentLoaded',()=>{const betSlider=document.getElementById('betSlider');getBet=createBetSlider({inputId:'betSlider',displayId:'betDisplay',min:1,max:500,value:10,onChange:v=>betOut.textContent=money(v)});document.getElementById('betChips').addEventListener('click',e=>{const b=e.target.closest('button[data-chip]');if(!b||state==='playing')return;betSlider.value=Math.max(Number(betSlider.min||1),Math.min(Number(betSlider.max||500),Number(betSlider.value||0)+Number(b.dataset.chip)));betSlider.dispatchEvent(new Event('input'));}); render();});
function points(c){return c.value===1?11:c.value>10?10:c.value}
function score(hand){let s=0,a=0;hand.forEach(c=>{s+=points(c);if(c.value===1)a++});while(s>21&&a>0){s-=10;a--}return s}
function render(hideDealer=true){playerHand.innerHTML=player.map(c=>cardHTML(c)).join('');dealerHand.innerHTML=dealer.map((c,i)=>cardHTML(c,hideDealer&&state==='playing'&&i===1)).join('');playerScore.textContent=score(player);dealerScore.textContent=(state==='playing'&&hideDealer)?points(dealer[0]):score(dealer);syncUI();dealBtn.disabled=state==='playing';dealBtn.textContent=state==='done'?'Nächste Runde':'Geben';hitBtn.disabled=state!=='playing';standBtn.disabled=state!=='playing';if(typeof doubleBtn!=="undefined")doubleBtn.disabled=!(state==='playing'&&player.length===2&&canAfford(roundBet));}
function deal(){const bet=getBet();if(!canAfford(bet))return toast('Nicht genug Guthaben.','bad');player=[];dealer=[];roundBet=bet;betOut.textContent=money(roundBet);changeCash(-roundBet);deck=makeDeck(4);player=[deck.pop(),deck.pop()];dealer=[deck.pop(),deck.pop()];state='playing';msg.textContent='Hit oder Stand?';render();if(score(player)===21)stand();}
function hit(){player.push(deck.pop());if(score(player)>21)return finish('Bust! Du verlierst.',-roundBet);render();}
function doubleDown(){if(state!=='playing'||player.length!==2)return;if(!canAfford(roundBet))return toast('Nicht genug Guthaben zum Verdoppeln.','bad');changeCash(-roundBet);roundBet*=2;betOut.textContent=money(roundBet);player.push(deck.pop());if(score(player)>21)return finish('Double Down Bust! Du verlierst.',-roundBet);render(false);stand();}
function stand(){while(score(dealer)<17)dealer.push(deck.pop());const ps=score(player),ds=score(dealer),bet=roundBet;if(ds>21||ps>ds)finish(`Gewonnen! +${money(bet*2)}`,bet);else if(ps===ds){changeCash(bet);finish('Push - Einsatz zurück.',0,true)}else finish('Dealer gewinnt.',-bet);}
function finish(text,profit,push=false){if(!push&&profit>0)changeCash(roundBet*2);state='done';msg.textContent=text;recordGame('Blackjack',profit);render(false)}
</script>
</body>
</html>
